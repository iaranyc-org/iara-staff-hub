<style>
  :root{
    --ink:#faf6f0;
    --ink-soft:#b3a695;
    --ink-mid:#ded5c7;
    --paper:#391d1f;
    --paper-raised:#4a2528;
    --line:#5f3b3e;
    --forest:#e0633f;
    --forest-ink:#2a1206;
    --sun:#fbbf56;
    --sun-ink:#391d1f;
    --river:#e8cbab;
    --display:#e8cbab;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 28px -14px rgba(0,0,0,.6);
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{ background:var(--paper); }
  html.booting #gate, html.booting #launcher{ visibility:hidden; }
  body{
    margin:0; min-height:100vh;
    color:var(--ink);
    font-family:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--sun); color:var(--sun-ink); }
  a{ color:inherit; text-decoration:none; }
  .logo-img{ display:block; }
  ::placeholder{ color: color-mix(in srgb, var(--ink) 45%, transparent); }
  /* #gate/#launcher set their own `display:flex` below, which otherwise
     outranks the UA [hidden]{display:none} rule and defeats the attribute
     entirely - both screens would stack instead of one replacing the other. */
  #gate[hidden], #launcher[hidden]{ display:none; }

  /* ===================== Gate ===================== */
  #gate{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 20px;
    background:
      linear-gradient(140deg, rgba(43,21,23,.88) 0%, rgba(57,29,31,.82) 52%, rgba(85,41,31,.86) 100%),
      url("/img/amazon.jpg") center/cover no-repeat, #391d1f;
  }
  .gate-card{
    width:100%; max-width:400px; background:var(--paper-raised); border:1px solid var(--line);
    border-radius:10px; padding:36px 32px; box-shadow:var(--shadow);
  }
  .gate-mark{ display:flex; align-items:center; gap:12px; margin-bottom:24px; }
  .gate-mark .logo-img{ width:34px; height:auto; flex:none; }
  /* Same lockup as Lineup's gate and every OG card in the family (Fraunces,
     cream) - matches the identical fix in iara_staff_hub.html. */
  .gate-mark .word{ font-family:'Fraunces',Georgia,serif; font-weight:400; font-style:italic; font-size:22px;
    letter-spacing:-.005em; color:var(--river); }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12.5px; font-weight:700; letter-spacing:.01em; color:var(--ink-soft); margin-bottom:6px; }
  .field input{
    width:100%; padding:11px 13px; border-radius:6px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); font:inherit; font-size:15px;
  }
  .field input:focus{ outline:2px solid var(--river); outline-offset:1px; border-color:var(--river); }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    border-radius:6px; border:1.5px solid transparent; padding:11px 18px; min-height:44px;
    font-weight:700; font-size:14.5px; cursor:pointer; transition:transform .08s ease, opacity .15s ease;
  }
  .btn:active{ transform:translateY(1px); }
  .btn-primary{ background:var(--forest); color:var(--forest-ink); width:100%; }
  .btn-primary:hover{ opacity:.92; }
  .form-err{ color:var(--sun); font-size:12.5px; margin:-6px 0 14px; }

  /* ===================== Launcher ===================== */
  #launcher{
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:48px 20px;
    background:
      linear-gradient(160deg,
        color-mix(in srgb, var(--forest) 11%, var(--paper)) 0%,
        var(--paper) 42%,
        color-mix(in srgb, var(--sun) 13%, var(--paper)) 100%);
    background-attachment:fixed;
  }
  /* The grain overlay that used to live here (feTurbulence + mix-blend-mode
     :overlay on a position:fixed pseudo-element) is a known-bad combination
     on real iOS Safari - it stops blending and paints as a blown-out solid
     color across the page instead. Confirmed live on Lineup's Menu view
     (same recipe, same file family) as a wash of neon pink, not reproducible
     in any simulated/desktop browser. Removed here too rather than re-tuned. */

  .wrap{ position:relative; z-index:1; width:100%; max-width:560px; }
  .mark{ display:flex; align-items:center; justify-content:center; gap:16px; margin-bottom:40px; }
  .mark .logo-img{ width:clamp(48px,9vw,64px); height:auto; }
  .mark .word{ font-family:'Fraunces',Georgia,serif; font-weight:400; font-style:italic; font-size:clamp(32px,7vw,44px);
    color:var(--display); letter-spacing:-.01em; }

  .apps{ display:grid; gap:14px; }
  .app-badge{
    font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--sun-ink); background:var(--sun); border-radius:100px; padding:2px 8px;
  }

  /* ===================== App switch + panel ===================== */
  .app-switch{ display:flex; gap:8px; margin-bottom:16px; }
  .switch-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:9px;
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:13px 14px; min-height:44px; font:inherit; font-weight:700; font-size:14px;
    color:var(--ink-soft); cursor:pointer; transition:border-color .12s ease, color .12s ease, background .12s ease;
  }
  .switch-btn:hover{ color:var(--ink); }
  .switch-btn:focus-visible{ outline:2px solid var(--sun); outline-offset:2px; }
  .switch-btn.active{ color:var(--ink); border-color:var(--sun); background:color-mix(in srgb, var(--sun) 10%, var(--paper-raised)); }
  .card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:10px;
    padding:24px 22px; box-shadow:var(--shadow); position:relative;
  }
  .card::before{
    content:""; position:absolute; inset:0 0 auto 0; height:1px; border-radius:inherit;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.10) 22%, rgba(255,255,255,.10) 78%, transparent);
    pointer-events:none;
  }
  .panel-desc{ margin:0 0 20px; font-size:13.5px; color:var(--ink-soft); line-height:1.55; }
  .panel-desc .app-badge{ margin-left:6px; vertical-align:1px; }
  #panel-lineup .field:last-of-type{ margin-bottom:22px; }
  .field select{
    width:100%; padding:11px 13px; border-radius:6px; border:1.5px solid var(--line);
    background:var(--paper); color:var(--ink); font:inherit; font-size:15px;
  }
  .field select:focus{ outline:2px solid var(--river); outline-offset:1px; border-color:var(--river); }
</style>
<script>
  document.documentElement.classList.add("booting");
  setTimeout(function(){ document.documentElement.classList.remove("booting"); }, 1500);
</script>

         different things from this page (a shift vs. inventory), so the
         picker decides what the rest of the panel below it asks for,
         rather than showing both apps as identical link-out cards. -->

      <button class="switch-btn active" id="switch-lineup" role="tab" aria-selected="true">Lineup</button>
      <button class="switch-btn" id="switch-ops" role="tab" aria-selected="false">Kitchen Ops</button>
    </div>

    <div class="app-panel card" id="panel-lineup">
      <p class="panel-desc">Service manual, the menu with pronunciations, and pre-shift practice.</p>
      <form id="lineup-form">
        <div class="field">
          <label for="ll-name">Your name</label>
          <input id="ll-name" type="text" required autocomplete="name" placeholder="e.g. Jordan Alves">

        <div class="field">
          <label for="ll-role">Your role</label>
          <select id="ll-role" required>
            <option value="" disabled selected>Choose a role</option>
            <option>Host</option>
            <option>Server</option>
            <option>Busser</option>
            <option>Bartender</option>
            <option>Food Runner</option>
            <option>Line Cook</option>
            <option>Lead Line Cook</option>
            <option>Prep Cook</option>
            <option>Dishwasher</option>
            <option>Barback</option>
            <option>General Manager</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Continue to Lineup</button>
      </form>
    </div>

    <div class="app-panel card" id="panel-ops" hidden>
      <p class="panel-desc">Ingredient costing, inventory counts, and purchasing. <span class="app-badge">Manager</span></p>
      <a class="btn btn-primary" href="/ops" style="text-decoration:none;">Continue to Kitchen Ops →</a>
    </div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script>
(function(){
  // The typed password is checked against Firebase for real, the same way
  // iara_staff_hub.html itself does it. A hardcoded string comparison here
  // would mean the actual password sits in plain text in this file's own
  // source - readable by anyone who views it, no login required, which is
  // strictly worse than not having a gate at all. This must never go back
  // to a client-side string compare.
  var STAFF_EMAIL = "staff@iara.nyc";
  var LS_PW = "iara_pw";
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyAj4YUF1DteDZgXM5zV_T08DV3OjzwD_SE",
    authDomain: "iara-lineup.firebaseapp.com",
    projectId: "iara-lineup",
    storageBucket: "iara-lineup.firebasestorage.app",
    messagingSenderId: "840712867607",
    appId: "1:840712867607:web:2003c145731aa85a13b152"
  };
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);

  var gate = document.getElementById("gate");
  var launcher = document.getElementById("launcher");
  var form = document.getElementById("gate-form");
  var pwField = document.getElementById("hub-pw");
  var err = document.getElementById("hub-err");
  var submitBtn = form.querySelector("button[type=submit]");

  function unlock(){
    gate.hidden = true;
    launcher.hidden = false;
  }

  // Same-origin: a session from Lineup or Ops already carries over here via
  // Firebase's own persistence, so a returning device skips the prompt.
  // Firebase always fires this once at load (null first if signed out), so
  // it is also what has to reveal the gate, not just react once signed in -
  // leaving #gate's default [hidden] alone here left a signed-out visitor
  // looking at a blank page.
  firebase.auth().onAuthStateChanged(function(user){
    if (user) unlock();
    else { gate.hidden = false; launcher.hidden = true; }
  });

  form.addEventListener("submit", function(ev){
    ev.preventDefault();
    err.hidden = true;
    submitBtn.disabled = true;
    var pw = pwField.value;
    firebase.auth().signInWithEmailAndPassword(STAFF_EMAIL, pw).then(function(){
      try { localStorage.setItem(LS_PW, pw); } catch(e){}
      submitBtn.disabled = false;
      unlock();
    }).catch(function(){
      submitBtn.disabled = false;
      err.hidden = false;
      pwField.select();
    });
  });

  // ---- App switch ----
  var swLineup = document.getElementById("switch-lineup");
  var swOps = document.getElementById("switch-ops");
  var panelLineup = document.getElementById("panel-lineup");
  var panelOps = document.getElementById("panel-ops");
  function showPanel(which){
    var isLineup = which === "lineup";
    swLineup.classList.toggle("active", isLineup);
    swOps.classList.toggle("active", !isLineup);
    swLineup.setAttribute("aria-selected", String(isLineup));
    swOps.setAttribute("aria-selected", String(!isLineup));
    panelLineup.hidden = !isLineup;
    panelOps.hidden = isLineup;
  }
  swLineup.addEventListener("click", function(){ showPanel("lineup"); });
  swOps.addEventListener("click", function(){ showPanel("ops"); });

  // ---- Hand off straight into Lineup, already signed in ----
  //
  // Same localStorage key and {id, name, role} shape iara_staff_hub.html's
  // own gate writes (LS_KEY = "iara_hub_profile_v1"). Its boot() skips its
  // gate entirely once that key holds a profile AND there is an active
  // Firebase session - both are already true by the time this fires, since
  // the hub's own gate just did the real sign-in. Filling this in a second
  // time inside Lineup is exactly the redundant step this page exists to
  // remove.
  // Same stableId contract as Lineup's own copy (iara_staff_hub.html) - the
  // Firestore doc is keyed by this id, so it must stay identical in both
  // places or the hub and a direct /lineup sign-in would fork the same
  // person into two records again.
  function stableId(name, role){
    var slug = (String(name || "") + "-" + String(role || ""))
      .toLowerCase()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")
      .replace(/[^a-z0-9]+/g, "-")
      .replace(/^-+|-+$/g, "");
    if (slug) return slug;
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }
  document.getElementById("lineup-form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var name = document.getElementById("ll-name").value.trim();
    var role = document.getElementById("ll-role").value;
    if (!name || !role) return;
    var profile = { id: stableId(name, role), name: name, role: role };
    try { localStorage.setItem("iara_hub_profile_v1", JSON.stringify(profile)); } catch(e){}
    location.href = "/lineup#/home";
  });
})();
</script>
