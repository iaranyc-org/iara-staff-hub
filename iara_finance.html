     Dark maroon only, like every manager app. */
  :root{ color-scheme:dark; }
  *{box-sizing:border-box;}
  html,body{background:var(--k-page); color:var(--k-ink); font-family:var(--k-font-sans); margin:0; -webkit-font-smoothing:antialiased;}

  .num{font-family:var(--k-font-mono); font-variant-numeric:tabular-nums;}
  .tabs-bar{position:sticky; top:var(--k-appbar-h); z-index:19; display:flex; align-items:center; gap:12px; margin:0 0 20px; padding:8px 0;

  @media (max-width:640px){ .tabs-bar{position:static; flex-wrap:wrap; box-shadow:none; clip-path:none; margin-bottom:12px;} .tabs-status{display:none;}
    .filters .k-input{max-width:none; flex:1 1 100%;} h2{font-size:26px;} }
  #main{display:flex; flex-direction:column; gap:18px; min-width:0; padding-bottom:48px;}
  .head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  .head .desc{font-size:13px; color:var(--k-muted); margin-top:4px; max-width:70ch;}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:var(--k-surface); border:1px solid var(--k-border); border-radius:var(--k-radius-lg); padding:14px 16px; display:flex; flex-direction:column; gap:4px;}
  .kpi .label{font-size:13px; color:var(--k-muted); font-weight:600;}

  .upload .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:4px;}
  .count-bar{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .count-head{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:flex-start;}
  .count-cats{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; position:sticky; top:var(--k-appbar-h); background:var(--k-page); z-index:5;}

  .icon-btn:hover{background:var(--k-raised);} .icon-btn:disabled{opacity:.7; cursor:default;}
  @media (pointer:coarse){ .icon-btn{width:44px; height:44px;} }

  @media (prefers-reduced-motion:reduce){ .icon-btn.spin svg{animation:none;} }
  .dropzone{margin-top:14px; padding:18px; border:1.5px dashed var(--k-border); border-radius:12px; text-align:center; font-size:14px; color:var(--k-muted); cursor:pointer;}
  .dropzone:hover, body.dragging .dropzone{border-color:var(--k-accent, var(--k-ink)); color:var(--k-ink);}
  body.dragging #main .k-card:first-of-type{outline:2px dashed var(--k-accent, var(--k-ink)); outline-offset:4px;}
  .up-list{margin-top:14px; display:flex; flex-direction:column; gap:8px;}
  .up-list .upload{margin-top:0; position:relative;}
  .up-bar{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .upload .pdf{width:72px; height:96px; border-radius:8px; flex:none; background:var(--k-surface); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--k-muted);}
  .up-x{flex:none;}
  details.more summary{cursor:pointer; font-size:14px; color:var(--k-muted); min-height:44px; display:flex; align-items:center;}
  /* Phones: each table row becomes a card, labels come from data-label. */
  @media (max-width:640px){
    table.stack{min-width:0;} table.stack thead{display:none;}
    table.stack tr{display:block; padding:10px 12px; border-bottom:1px solid var(--k-border);}
    table.stack tbody tr:last-child{border-bottom:none;}
    table.stack td{display:block; position:relative; padding:4px 0 4px 42%; border:none; text-align:right; min-height:22px; overflow-wrap:anywhere;}
    table.stack td::before{content:attr(data-label); position:absolute; left:0; top:5px; max-width:40%; color:var(--k-muted); font:500 12px/1.3 var(--k-font-sans); text-align:left;}
    table.stack td .sub{display:block;}
    table.stack .hide-sm{display:none;}
    table.stack td.first{display:block; text-align:left; font-weight:600; font-size:15px; padding:0 0 6px;}
    table.stack td.first::before{content:none;}
    table.stack td:empty{display:none;}
  }
  #authGate .bg{position:fixed; inset:0; background:var(--k-page); z-index:49;}
  #authGate .card{position:fixed; z-index:50; left:50%; top:50%; transform:translate(-50%,-50%); width:min(420px, calc(100vw - 32px));
    background:var(--k-surface); border:1px solid var(--k-border); border-radius:var(--k-radius-lg); padding:24px; display:flex; flex-direction:column; gap:16px; text-align:center; align-items:center;}
  .brand-word{font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:var(--k-lockup-word); line-height:1; color:var(--k-display);}
  .gate-lockup{display:flex; align-items:center; gap:12px;}
  .gate-lockup img{width:var(--k-lockup-mark); height:auto;}
  .pedit{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:6px;}
  .pedit label{display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--k-muted);}
  .pedit .k-input{width:100%;}
  .og-vendor{margin-top:14px;}
  .trend-up{color:var(--k-critical);} .trend-down{color:var(--k-good, var(--k-muted));}
</style>

<script>

function isManagerEmail(e){ return !!e && MANAGERS.indexOf(String(e).toLowerCase()) !== -1; }

var OPENING = "2026-10-02";

var EXPECTED_VENDORS = [

];

// Remember the open tab in the URL (#t=invoices) so a refresh lands on the same tab.
(function(){ var m=/[#&]t=([\w-]+)/.exec(location.hash); if(m && (m[1]==="duplicates"||m[1]==="missing")) m[1]="vendors"; if(m && TABS.some(function(t){return t.id===m[1];})) state.tab=m[1]; })();
function saveTab(){ history.replaceState(null,"",location.pathname+location.search+"#t="+state.tab); }
var db=null, auth=null, user=null;

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function money(n){ return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2, maximumFractionDigits:2}); }
function money0(n){ return (n<0?"-":"")+"$"+Math.round(Math.abs(n)).toLocaleString("en-US"); }
function dShort(iso){ if(!iso) return "No date"; var p=iso.slice(0,10).split("-"); return (+p[1])+"/"+(+p[2])+"/"+p[0].slice(2); }
function title(s){ return String(s||"").toLowerCase().replace(/\b([a-z])/g,function(m){return m.toUpperCase();}).replace(/\bLlc\b/g,"LLC").replace(/\bInc\b/g,"Inc").replace(/\b(Usa|Lp|Nyc|Ny|Nj|Eb|Ole)\b/g,function(m){ return m==="Ole"?m:m.toUpperCase(); }); }
function nyDay(add){ return new Date(Date.now()+add*864e5).toLocaleDateString("en-CA",{timeZone:"America/New_York"}); }
function toast(m){ if(window.iaraToast) iaraToast(m); }

/* ---------- data ---------- */
// Live = a real bill. Merged/duplicate/deleted/temporary are Ottimate's own bookkeeping; statements carry totals only.
var LIVE = {verified:1, digitized:1, incomplete:1, archived:1};
function parseCSV(text){
  var rows=[], row=[], f="", q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===","){ row.push(f); f=""; }
    else if(c==="\n"){ row.push(f); rows.push(row); row=[]; f=""; }
    else if(c!=="\r") f+=c;
  }
  if(f||row.length){ row.push(f); rows.push(row); }
  var h=rows.shift().map(function(k){return k.replace(/^\uFEFF/,"");});
  parseCSV.dropped = rows.filter(function(r){return r.length!==h.length && r.join("")!=="";}).length;
  return rows.filter(function(r){return r.length===h.length;}).map(function(r){ var o={}; h.forEach(function(k,i){o[k]=r[i];}); return o; });
}
function compact(r){
  var s=function(k){return r[k]==null?"":String(r[k]);};
  return { id:s("id"), v:s("vendor"), n:s("invoice_no"), d:s("date"), t:parseFloat(s("total").replace(/[$,]/g,""))||0, due:s("due"), ty:s("type"), s:s("state"),
           p:/^(true|yes|1)$/i.test(s("paid")), x:s("exported"), up:s("uploaded"), via:s("through"), f:s("file") };
}
function derive(rows){
  var live = rows.filter(function(r){ return LIVE[r.s] && r.ty!=="statement"; });
  var open = live.filter(function(r){ return r.d && r.d>=OPENING; });
  var pre = live.filter(function(r){ return r.d && r.d<OPENING; });
  var nodate = live.filter(function(r){ return !r.d; });
  var dups = rows.filter(function(r){ return r.s==="duplicate"; });
  var byKey = {}; live.forEach(function(r){ if(r.n) byKey[(r.v+"|"+r.n).toLowerCase()] = r; });
  dups.forEach(function(r){
    var o = r.n && byKey[(r.v+"|"+r.n).toLowerCase()];
    r.orig = o || null;
    r.gapH = (o && o.up && r.up) ? Math.round((new Date(r.up)-new Date(o.up))/36e5) : null;
  });
  var vend = {};
  live.forEach(function(r){
    var k = r.v || "(No vendor read yet)";
    var v = vend[k] || (vend[k] = {name:k, n:0, total:0, sinceOpen:0, nOpen:0, unpaid:0, last:"", dups:0});
    v.n++; v.total+=r.t; if(r.d>=OPENING){ v.sinceOpen+=r.t; v.nOpen++; } if(!r.p && r.ty!=="credit") v.unpaid+=r.t; if(r.d>v.last) v.last=r.d;
  });
  dups.forEach(function(r){ var k=r.v||"(No vendor read yet)"; (vend[k] || (vend[k]={name:k,n:0,total:0,sinceOpen:0,nOpen:0,unpaid:0,last:"",dups:0})).dups++; });
  var today = nyDay(0), in7 = nyDay(7);
  var unpaid = live.filter(function(r){ return !r.p && r.ty!=="credit"; });
  return {
    rows:rows, live:live, open:open, pre:pre, nodate:nodate, dups:dups,

/* ---------- invoices@ vs Ottimate (Jay 2026-11-07) ---------- */
// Every PDF or photo sent to invoices@ is read on the server (iara-inbox /api/invoices). Here each bill is matched to
// Ottimate by invoice number, so we can see anything the accountant never got.
var INBOX_API = "/inbox/api/invoices";
function numKeys(n){
  var a = String(n||"").toUpperCase().replace(/[^A-Z0-9]/g,""); if(!a) return [];
  var k = [a, a.replace(/^0+/,"")], digits = a.replace(/^[A-Z]+/,"").replace(/^0+/,"");
  if(digits.length>=5) k.push(digits);
  return k;
}
function matchInbox(D, items){
  var idx = {};
  (D ? D.rows : []).forEach(function(r){ numKeys(r.n).forEach(function(k){ (idx[k] = idx[k] || []).push(r); }); });
  var pulled = D && D.pulledAt ? D.pulledAt.slice(0,10) : "";
  var bills = [], other = [];
  var uploads = [];
  items.forEach(function(it){
    if(/^upload:/.test(it.id)){ uploads.push(it); return; }   // photo uploads have their own list; sent ones come back as mail
    if(it.kind!=="invoice" && it.kind!=="credit" && it.kind!=="unread"){ other.push(it); return; }
    var hit = null; numKeys(it.number).some(function(k){ if(idx[k]){ hit = idx[k].filter(function(r){return r.s!=="duplicate";})[0] || idx[k][0]; return true; } });
    // Fallback (Jay 2026-11-10: Ottimate read EB Express 1365610 A as 1355610): same vendor, same total to the cent,
    // within 21 days. Covers OCR misreads of the invoice number; the row shows the number Ottimate has.
    if(!hit && +it.total){ var w = String(it.vendor||it.sender||"").toLowerCase().replace(/[^a-z ]/g,"").split(" ").filter(function(x){ return x.length>2; })[0], day = (it.date||it.received||"").slice(0,10);
      hit = (D ? D.rows : []).filter(function(r){ return r.s!=="duplicate" && Math.abs((+r.t||0) - (+it.total)) < 0.01 && w && String(r.v||"").toLowerCase().indexOf(w)!==-1 &&
        (!day || !r.d || Math.abs(new Date(r.d) - new Date(day)) < 21*864e5); })[0] || null;
      if(hit) it.ottOther = String(hit.n||"").replace(/^#/,""); }
    it.ott = hit;
    // Physical copy wins (Jay 2026-11-12): when the invoice and Ottimate disagree on the total, the invoice is right.
    if(hit && +it.total && Math.abs(Math.abs(+hit.t||0) - Math.abs(+it.total)) >= 0.01) it.ottTotal = +hit.t||0;
    it.status = hit ? "in" : !it.number ? "check" : (pulled && (it.received||"").slice(0,10) >= pulled) ? "wait" : "missing";
    bills.push(it);
  });
  // A bill re-sent later (same invoice #) isn't missing any more: it's waiting on the newer copy.
  bills.forEach(function(it){ if(it.status!=="missing") return; var k=numKeys(it.number)[0];
    if(bills.some(function(o){ return o!==it && o.status!=="missing" && numKeys(o.number)[0]===k; })) it.status="resent"; });
  var byOtt = {}; bills.forEach(function(it){ if(it.ott && it.msg_id) byOtt[it.ott.id || (it.ott.v+"|"+it.ott.n)] = it; });
  return { bills:bills, other:other, byOtt:byOtt, uploads:uploads.sort(function(a,b){ return a.received<b.received?1:-1; }),
    in: bills.filter(function(b){return b.status==="in";}), missing: bills.filter(function(b){return b.status==="missing";}),
    check: bills.filter(function(b){return b.status==="check";}),
    differ: bills.filter(function(b){ return b.status==="in" && (b.ottOther || b.ottTotal!=null); }), wait: bills.filter(function(b){return b.status==="wait";}),
    last: items.reduce(function(m,i){ return (i.received||"")>m ? i.received : m; }, "") };
}
function differWhy(it){
  var p = [];
  if(it.ottTotal!=null) p.push("Ottimate has "+money(it.ottTotal)+", invoice says "+money(+it.total));
  if(it.ottOther) p.push("Ottimate has #"+it.ottOther+", invoice says #"+String(it.number||"").replace(/^#/,""));
  return p.join(". ")+". Invoice is right: ask the accountant to fix Ottimate.";
}
function differNote(list){
  return "Hi, a few bills in Ottimate don't match the invoice itself. The invoice is correct; could you update Ottimate?\n\n"+
    list.map(function(it){ return "- "+(it.vendor||it.sender||"")+" #"+String(it.number||"").replace(/^#/,"")+": "+
      [it.ottTotal!=null ? "total should be "+money(+it.total)+" (Ottimate has "+money(it.ottTotal)+")" : "", it.ottOther ? "invoice # should be "+String(it.number||"").replace(/^#/,"")+" (Ottimate has "+it.ottOther+")" : ""].filter(Boolean).join("; "); }).join("\n")+"\n\nThanks";
}
function fileUrl(it, dl){ if(it && /^invoice-uploads\//.test(it.part_id||"")) return INBOX_API+"/file?b="+encodeURIComponent(it.part_id); return it && it.msg_id ? INBOX_API+"/file?m="+encodeURIComponent(it.msg_id)+"&p="+encodeURIComponent(it.part_id)+(dl?"&dl=1":"") : ""; }
function dlBtn(it){ var u=fileUrl(it); return u ? '<a class="dl" href="'+u+'" target="_blank" rel="noopener" aria-label="Open '+esc(it.file)+'">Open File</a>' : ""; }
async function loadInbox(refresh){
  state.inbox.busy = !!refresh; if(refresh) render();
  try{
    var r = refresh ? await fetch(INBOX_API,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"refresh"})})
                    : await fetch(INBOX_API,{credentials:"include"});
    var j = await r.json().catch(function(){return {};});

    else { if(j.items) state.inbox.items=j.items; state.inbox.err = j.error==="not-connected" ? "connect" : j.error ? "fail" : "";
      if(refresh && j.ok) toast(j.added ? "Found "+j.added+" new file"+(j.added===1?"":"s")+" in invoices@." : "No new invoices@ mail."); }
  }catch(e){ state.inbox.err="fail"; }
  state.inbox.busy=false; render();
}

function dupPattern(list){

  if(!gaps.length) return "Original not found, compare by hand";
  var same = gaps.filter(function(h){return h>=0 && h<2;}).length, week = gaps.filter(function(h){return h>=140 && h<=200;}).length;
  if(gaps.filter(function(h){return h<0;}).length===gaps.length) return "Copy arrived before the original, compare by hand";
  if(same>=gaps.length/2) return "Sends each bill twice at once: likely two email addresses on file";
  if(week>=gaps.length/2) return "Re-sends about a week later: likely a weekly statement or reminder";
  return "Re-sent later, gaps of "+gaps.map(function(h){return h<48?h+"h":Math.round(h/24)+"d";}).join(", ");

function missingLeads(D){

async function importOne(file){
  var text = await file.text();
  // An Ottimate line export (date,vendor,item,qty,...) feeds the Inventory tab.
  if(/^\W*date,vendor,item,qty/i.test(text)){
    try{
      var r = await fetch(INV_API,{method:"POST",credentials:"include",headers:{"Content-Type":"application/json"},body:JSON.stringify({csv:text})});
      var j = await r.json().catch(function(){return {};});
      if(!r.ok) throw new Error(j.error || (r.status===401?"Sign in to iara Inbox first.":"Server error"));
      toast("Loaded "+j.lines+" delivered lines for Inventory."); state.inv = null; render();
    }catch(err){ toast("Inventory import failed: "+(err.message||err)); }
    return;
  }
  try{
    var rows = parseCSV(text);
    if(!rows.length || !("vendor" in rows[0]) || !("state" in rows[0])) throw new Error("This doesn't look like an Ottimate export.");
    rows = rows.filter(function(r){ return r.state!=="deleted" && r.state!=="temporary"; }).map(compact);
    await db.collection("meta").doc("ottimate").set({ pulledAt:new Date().toISOString(), source:file.name, by:user.email, rows:rows });
    toast("Imported "+rows.length+" Ottimate documents."+(parseCSV.dropped?" "+parseCSV.dropped+" unreadable rows skipped.":""));
  }catch(err){ console.error(err); toast("Import failed: "+(err.message||err)); }
}

var SYNC_API = "https://iara-inbox.vercel.app/inbox/api/ottimate-sync";
function iaraSyncBookmarklet(){
  (async function(){
    var AUTH = "__IARA_SYNC__";
    if(!/plateiq\.com|ottimate/.test(location.host)){ alert("Open Ottimate first (dashboard.plateiq.com), then click Sync to iara."); return; }
    var k = Object.keys(localStorage).filter(function(x){ return x.indexOf("authInfo")===0; })[0];
    if(!k){ alert("Sign in to Ottimate first, then click Sync to iara."); return; }
    var H = {Authorization: "Bearer " + JSON.parse(localStorage[k]).access_token};
    var box = document.createElement("div");
    box.style.cssText = "position:fixed;z-index:2147483647;top:16px;right:16px;max-width:340px;background:#391d1f;color:#fff;padding:14px 18px;border-radius:12px;font:14px/1.4 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.4)";
    document.body.appendChild(box);
    var say = function(m){ box.textContent = "iara sync: " + m; };
    var get = async function(u){ var r = await fetch(u, {headers: H}); if(r.status === 401) throw new Error("Ottimate signed you out. Sign out and back in to Ottimate, then click Sync to iara again."); return r.json(); };
    var nm = function(x){ return x && typeof x === "object" ? (x.name || "") : String(x || ""); };
    try{
      say("reading invoices…");
      var inv = [];
      for(var p = 1; p < 80; p++){ var d = await get("https://api.plateiq.com/invoice/?page=" + p + "&per_page=100"); var L = d.results || d.data || []; if(!L.length) break; inv = inv.concat(L); }
      var vd = await get("https://api.plateiq.com/vendor/?per_page=200"), vm = {};
      (vd.results || vd.data || []).forEach(function(v){ vm[v.id] = v.name; });
      var rows = inv.filter(function(i){ return i.state !== "deleted" && i.state !== "temporary"; }).map(function(i){ return {
        id: String(i.id), v: vm[i.vendor] || nm(i.vendor), n: String(i.invoice_number || ""), d: i.date || "", t: +i.total_amount || 0, due: i.due_date || "",
        ty: i.invoice_type || "", s: i.state, p: !!i.paid, x: i.exported_date ? String(i.exported_date).slice(0, 10) : "", up: i.created_date || "", via: i.upload_through || "", f: "" }; });
      say("reading items…");
      var items = [], seen = {};
      for(var q = 1; q < 80; q++){ var d2 = await get("https://api.plateiq.com/item/?per_page=100&page=" + q); var L2 = d2.results || []; if(!L2.length) break; items = items.concat(L2); }
      items = items.filter(function(i){ if(seen[i.id]) return false; seen[i.id] = 1; return true; });
      var lines = [], left = items.slice(), n = 0;
      var worker = async function(){ var i; while((i = left.shift())){ try{ (await get(i.trend)).forEach(function(t){ lines.push([t.date, nm(i.vendor), i.display_name || i.name, t.quantity, t.unit, t.price, t.total_amount, t.invoice_number]); }); }catch(e){ if(/signed you out/.test(e.message)) throw e; } say("reading prices " + (++n) + " of " + items.length); } };
      await Promise.all([worker(), worker(), worker(), worker(), worker(), worker()]);
      var esc = function(v){ return '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"'; };
      var csv = ["date,vendor,item,qty,unit,price,total,invoice"].concat(lines.sort(function(a, b){ return a[0] < b[0] ? -1 : 1; }).map(function(l){ return l.map(esc).join(","); })).join("\n");
      say("saving to iara Finance…");
      var r = await fetch("__SYNC_API__", {method: "POST", headers: {"Content-Type": "application/json", "x-iara-sync": AUTH}, body: JSON.stringify({invoices: rows, lines: csv})});
      var j = await r.json().catch(function(){ return {}; });
      if(!r.ok) throw new Error(j.error || ("iara Finance said " + r.status));
      say("done. " + j.invoices + " invoices and " + j.lines + " price lines saved. Refresh Finance to see them.");
      setTimeout(function(){ box.remove(); }, 12000);
    }catch(err){ say(err.message || String(err)); }
  })();
}
function syncHref(){
  if(!state.syncAuth) return "";
  return "javascript:" + encodeURIComponent("(" + iaraSyncBookmarklet.toString().replace("__IARA_SYNC__", state.syncAuth).replace("__SYNC_API__", SYNC_API) + ")()");
}
// Synced invoices live on the server; use them when they're newer than the last manual CSV import (Firestore).
async function loadSync(){
  try{
    var r = await fetch("/inbox/api/ottimate-sync", {credentials:"include"}); if(!r.ok) return;
    var j = await r.json(); state.syncAuth = j.email + ":" + j.token;
    if(j.invoices && j.invoices.rows && (!state.fsPulledAt || j.invoices.pulledAt > state.fsPulledAt)){
      state.data = Object.assign(derive(j.invoices.rows), {pulledAt:j.invoices.pulledAt}); state.loaded = true;
    }
    render();
  }catch(e){}
}
function syncCard(){
  return '<div class="k-card" style="margin-bottom:16px"><div class="section-title">Sync from Ottimate</div>'+
    '<p class="note" style="margin-bottom:10px">One click replaces both CSV imports: invoices for the Invoices check, and item prices and deliveries for Inventory. If you added the first version of this bookmark, delete it and drag this one.</p>'+
    '<ol class="note" style="padding-left:18px; display:flex; flex-direction:column; gap:6px; margin-bottom:12px"><li>Show your bookmarks bar (⌘⇧B), then drag this button onto it: <a class="k-btn k-btn-primary k-btn-sm" href="'+(syncHref()||"#")+'" onclick="event.preventDefault(); if(window.iaraToast) iaraToast(\'Drag it to your bookmarks bar instead of clicking.\')">Sync to iara</a></li>'+
    '<li>Open Ottimate (dashboard.plateiq.com) and sign in.</li><li>Click <b style="color:var(--k-ink)">Sync to iara</b> in your bookmarks bar. A box shows progress for about a minute and says "done". Then refresh this page.</li></ol>'+
    '<button class="k-btn k-btn-sm k-btn-ghost" data-act="syncHelp">Close</button></div>';
}

/* ---------- auth + sync ---------- */
function showGate(){ var b=$("[data-k-appbar]"); if(b) b.hidden=true; $("#authGate").hidden=false; }
function hideGate(){ $("#authGate").hidden=true; var b=$("[data-k-appbar]"); if(b) b.hidden=false;
  if(window.iaraNav) iaraNav.setAccount({email:user.email, signOut:function(){auth.signOut();}}); }
firebase.apps.length || firebase.initializeApp(FIREBASE_CONFIG);
var app = firebase.apps.filter(function(a){return a.name==="manager";})[0] || firebase.initializeApp(FIREBASE_CONFIG,"manager");
auth = app.auth();
var unsub = null;
auth.onAuthStateChanged(function(u){
  try{ if(u && isManagerEmail(u.email)) localStorage.setItem("iara_mgr_auth_hint","1"); else localStorage.removeItem("iara_mgr_auth_hint"); }catch(e){}
  if(unsub){ unsub(); unsub=null; }
  if(u && isManagerEmail(u.email)){
    user=u; db=app.firestore(); hideGate(); if(!state.inbox.items) loadInbox(false);
    unsub = db.collection("meta").doc("ottimate").onSnapshot(function(s){
      state.loaded=true; var d=s.exists?s.data():null;
      state.fsPulledAt = d ? d.pulledAt : "";
      if(!state.data || !state.data.pulledAt || !d || d.pulledAt >= state.data.pulledAt) state.data = d ? Object.assign(derive(d.rows||[]), {pulledAt:d.pulledAt}) : state.data;
      render(); loadSync();
    }, function(err){ console.error(err); state.loaded=true; toast("Couldn't load Finance data. Refresh to try again."); render(); });
  } else { user=null; db=null; showGate(); }
});
$("#authGateBtn").addEventListener("click", async function(){
  var msg=$("#authGateMsg"); msg.hidden=true;
  try{
    var p=new firebase.auth.GoogleAuthProvider(); p.setCustomParameters({prompt:"select_account", hd:"iara.nyc"});
    var r=await auth.signInWithPopup(p);
    if(!r.user || !isManagerEmail(r.user.email)){ var bad=r.user&&r.user.email; await auth.signOut(); msg.textContent=(bad||"That account")+" isn't on the manager list."; msg.hidden=false; }
  }catch(err){ if(err.code!=="auth/popup-closed-by-user"){ msg.textContent="Sign-in didn't finish. Try again."; msg.hidden=false; } }
});
render();
});
</script>
