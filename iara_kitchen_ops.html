<style>
  /* iara signage palette (the same tokens iara_staff_hub.html and
     iara_hub.html use), pinned dark on every device - iara.nyc has no
     light mode, so Kitchen Ops doesn't get one either. Every color below
     is measured against the background it actually sits on (design-review
     rule), not guessed: badge/critical text against its own tinted card,
     not the flat page. See git history for the contrast numbers. */
  /* Legacy Ops token names, now aliases onto the iara staff kit
     (/kit/tokens.css). Dark maroon only: no light theme (Jay, 2026-10-13). */
  :root{
    --accent:var(--k-primary); --accent-strong:var(--k-accent-text); --accent-soft:color-mix(in srgb, var(--k-primary) 16%, transparent); --accent-ink:var(--k-primary-ink);
    --surface:var(--k-surface); --surface-raised:var(--k-raised); --page:var(--k-page);
    --ink:var(--k-ink); --ink-secondary:var(--k-muted); --ink-muted:var(--k-muted);
    --border:var(--k-border); --grid:var(--k-border); --baseline:var(--k-border-input);
    --display:var(--k-display);
    --good:var(--k-good); --warning:var(--k-warning); --serious:var(--k-accent-text); --critical:var(--k-critical);
    /* chart/category fills (non-text) */
    --cat-1:var(--k-primary); --cat-2:var(--k-sun); --cat-3:#6fb572; --cat-4:#c97a4a; --cat-5:#ce6f77; --cat-6:#cbb08a;
    /* text versions for category labels on the raised badge ground */
    --cat-1-text:var(--k-accent-text); --cat-2-text:var(--k-sun); --cat-3-text:#94c896;
    --cat-4-text:#e0b297; --cat-5-text:#e3aeb2; --cat-6-text:#d0b896;
    --font-sans:var(--k-font-sans);
    --font-display:var(--k-font-display);
    --font-mono:var(--k-font-mono);
    --shadow-card:0 1px 2px rgb(0 0 0 / .4);
    --shadow-modal:0 8px 24px rgb(0 0 0 / .35);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html{background:var(--page);}
  body{
    /* Flat page ground like every other manager app: the sticky bar and section tabs paint
       the same colour, so no stripe shows where they sit (the old gradient made one). */
    background:var(--page);
    color:var(--ink); font-family:var(--font-sans); padding-inline:0; margin:0;
    -webkit-font-smoothing:antialiased;
  }
  /* The grain overlay that used to live here (feTurbulence + mix-blend-mode
     :overlay on a position:fixed body::before) is a known-bad combination on
     real iOS Safari - it stops blending and paints as a blown-out solid
     color across the whole page instead. Confirmed live on Lineup's Menu
     view (same recipe, same file family) as a wash of neon pink covering
     everything, not reproducible in any simulated/desktop browser. Removed
     here too rather than re-tuned. */
  #app, #modalRoot, #authGate, .toast-stack{ position:relative; z-index:1; }
  #app{min-height:100%; display:flex; flex-direction:column;}
  button, input, select, textarea{font:inherit; color:inherit;}
  h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:700;}
  h1,h2{font-family:var(--font-display); font-weight:600; color:var(--display); letter-spacing:-.01em; line-height:1.15;}
  p{margin:0;}
  a{color:var(--accent);}
  .num{font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .muted{color:var(--ink-muted);}
  .secondary-ink{color:var(--ink-secondary);}

  /* Gate lockup (the cross-app bar is kit/nav.js). */
  .brand{display:flex; align-items:center; gap:12px; min-height:var(--k-tap); color:inherit; min-width:0; flex-wrap:wrap; row-gap:6px;}
  .gate-lockup{cursor:default; justify-content:center;}
  .brand-word{white-space:nowrap; font-family:"Fraunces",Georgia,serif; font-style:italic; font-size:var(--k-lockup-word); line-height:1; color:var(--k-display);}
  .brand-mark{width:var(--k-lockup-mark); height:auto; display:block; flex:none;}
  [data-k-appbar]{position:sticky; top:0; z-index:900;}
  .tabs-status{display:flex; align-items:center; gap:14px; flex:none; margin-left:auto;}
  .today-label{font-size:12px; color:var(--ink-muted); white-space:nowrap;}
  .sync-chip{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-muted); flex:none; white-space:nowrap;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none;}
  .sync-dot.off{background:var(--ink-muted);}
  /* The section tabs get the room below 1100px: date hides, sync status goes short. */
  @media (max-width:1099px){
    .sync-chip .sync-label-full{display:none;}
    .sync-chip .sync-label-short{display:inline;}
    .today-label{display:none;}
  }
  @media (min-width:1100px){
    .sync-chip .sync-label-short{display:none;}
  }

  /* Sticky section tabs: inside the kit page frame (.k-page), directly under the sticky app bar.
     Its contents line up with the frame (and the bar's iara mark); the ground and the bottom rule
     run full width so nothing scrolls past at the sides. One row at every width: the tabs scroll
     sideways when they don't fit, the sync status stays pinned right. */
  .tabs-bar{
    position:sticky; top:calc(var(--k-appbar-h) + max(0px, env(safe-area-inset-top,0px) - 8px)); z-index:19;
    display:flex; align-items:center; gap:12px; margin:0 0 20px; padding:8px 0;
    /* full-width ground + 1px bottom rule via shadows (shadows never add page scroll) */
    background:var(--page); box-shadow:0 0 0 100vmax var(--page), 0 1px 0 100vmax var(--border); clip-path:inset(0 -100vmax -1px -100vmax);
  }
  nav.tabs{
    display:flex; flex:0 1 auto; min-width:0; gap:4px; padding:4px; overflow-x:auto; scrollbar-width:none;
    border-radius:var(--k-radius-lg); background:var(--k-surface); border:1px solid var(--k-border);
  }
  nav.tabs::-webkit-scrollbar{display:none;}
  /* Scroll cue: fade the trailing edge while more tabs sit off-screen (class toggled from JS). */
  nav.tabs.more-right{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent); mask-image:linear-gradient(90deg,#000 calc(100% - 48px),transparent);}
  nav.tabs button{
    flex:none; border:0; background:none; color:var(--k-muted);
    padding:0 14px; min-height:36px; display:inline-flex; align-items:center;
    border-radius:var(--k-radius); font:600 14px/1 var(--k-font-sans); cursor:pointer; white-space:nowrap; font-variant-numeric:tabular-nums;
  }
  @media (pointer:coarse), (max-width:1023px){ nav.tabs button{min-height:var(--k-tap);} }
  nav.tabs button:hover{color:var(--k-ink);}
  nav.tabs button.active{background:var(--k-primary); color:var(--k-primary-ink);}
  nav.tabs button:focus-visible{outline:2px solid var(--k-ring); outline-offset:-2px;}
  @media (max-width:767px){ .tabs-bar{margin-bottom:16px;} }

  /* Page content (frame comes from the kit's .k-page). */
  #main{display:flex; flex-direction:column; gap:18px; min-width:0;}

  .panel-head{display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap;}
  /* Page titles were 23px/600 against 13.5px body - only a ~1.7x ratio,
     and close enough to the 24px KPI numbers below them that neither one
     clearly led. Widening the jump (not adding another size step) is what
     actually reads as intentional hierarchy rather than timid. */
  .panel-head h2{font-size:30px; letter-spacing:-.015em;}
  .panel-head .desc{font-size:13px; color:var(--ink-muted); margin-top:2px;}

  /* Buttons are the kit's .k-btn (staff.css). Never hand-roll one here. */
  .icon{flex:none; display:block;}

  .card{background:var(--k-surface); border:1px solid var(--k-border); border-radius:var(--k-radius-lg); padding:16px;}
  @media (min-width:900px){ .card{padding:20px;} }
  .grid{display:grid; gap:12px;}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:12px;}
  @media (max-width:860px){ .kpis{grid-template-columns:repeat(2,1fr);} }
  .kpi{background:var(--k-surface); border:1px solid var(--k-border); border-radius:var(--k-radius-lg); padding:14px 16px; display:flex; flex-direction:column; gap:4px;}
  .kpi .label{font-size:13px; color:var(--k-muted); font-weight:600;}
  .kpi .value{font-family:var(--font-mono); font-size:24px; font-weight:600; font-variant-numeric:tabular-nums;}
  .kpi .foot{font-size:12px; color:var(--ink-secondary);}
  .kpi.alert .value{color:var(--critical);}

  /* kit .k-badge: solid raised ground, colour text, radius 6. The dot stays:
     it encodes status alongside the colour. */
  .badge{display:inline-flex; align-items:center; gap:4px; font:600 12px/1.4 var(--k-font-sans); padding:2px 8px; border-radius:var(--k-radius-sm); background:var(--k-raised); color:var(--k-ink); font-variant-numeric:tabular-nums;}
  .badge.good{color:var(--k-good);}
  .badge.warning{color:var(--k-warning);}
  .badge.serious{color:var(--k-accent-text);}
  .badge.critical{color:var(--k-critical);}
  .badge.neutral{color:var(--k-muted);}
  .badge::before{content:''; width:6px; height:6px; border-radius:50%; background:currentColor; flex:none;}

  .table-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:12px;
    /* Scroll shadows: show an edge shadow only where more columns are hidden. */
    background:
      linear-gradient(90deg, var(--surface) 30%, transparent) left/40px 100% no-repeat local,
      linear-gradient(270deg, var(--surface) 30%, transparent) right/40px 100% no-repeat local,
      radial-gradient(farthest-side at 0 50%, rgba(0,0,0,.55), transparent) left/14px 100% no-repeat scroll,
      radial-gradient(farthest-side at 100% 50%, rgba(0,0,0,.55), transparent) right/14px 100% no-repeat scroll;
    background-color:var(--surface);}
  .table-wrap table{background:transparent;}
  /* Phone/tablet: pin the name column so key numbers scroll beside it. */
  @media (max-width:860px){
    .table-wrap th:first-child, .table-wrap td:first-child{position:sticky; left:0; z-index:1; background:var(--surface); min-width:130px; max-width:170px; box-shadow:1px 0 0 var(--border);}
    .table-wrap thead th:first-child{background:var(--surface-raised); z-index:2;}
    .table-wrap tbody tr:hover td:first-child{background:var(--k-raised);}
  }
  table{width:100%; border-collapse:collapse; min-width:560px; background:var(--surface);}
  thead th{position:sticky; top:0; background:var(--surface-raised); text-align:left; font-size:12px; color:var(--k-muted); font-weight:700; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap;}
  tbody td{padding:10px 12px; border-bottom:1px solid var(--border); font-size:13.5px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--k-raised);}
  td.num, th.num{text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums;}
  .row-actions{display:flex; gap:8px; justify-content:flex-end;}
  .empty-state{padding:32px 20px; text-align:center; color:var(--k-muted); font-size:14px;}
  .section-title{font-size:14px; font-weight:700; color:var(--k-ink); margin-bottom:8px;}

  .sample-banner{display:flex; align-items:center; gap:10px; background:var(--k-surface); color:var(--k-accent-text); border:1px solid var(--k-accent-text); border-radius:var(--k-radius); padding:12px 14px; font-size:14px; font-weight:600;}
  .toast-stack{position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 16px); left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; align-items:center;}
  .toast{display:flex; align-items:center; gap:16px; background:var(--k-raised); color:var(--k-ink); border:1px solid var(--k-border); padding:12px 16px; border-radius:var(--k-radius-lg); font:500 14px/1.3 var(--k-font-sans); box-shadow:0 8px 24px rgb(0 0 0 / .35);}
  .toast button{background:none; border:0; color:var(--k-sun); font:700 14px/1 var(--k-font-sans); cursor:pointer; min-height:36px;}
  /* modal */
  #modalRoot .modal-backdrop{position:fixed; inset:0; background:rgb(0 0 0 / .5); z-index:49;}
  #modalRoot .modal-card{
    position:fixed; z-index:50; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(560px, calc(100vw - 32px)); max-height:min(88vh, 820px); overflow-y:auto;
    background:var(--k-surface); border:1px solid var(--k-border); border-radius:var(--k-radius-lg); box-shadow:var(--shadow-modal); padding:20px;
    display:flex; flex-direction:column; gap:14px;
  }
  #modalRoot .modal-card.wide{width:min(760px, calc(100vw - 32px));}
  #authGate .modal-backdrop{position:fixed; inset:0; background:var(--k-page); z-index:49;}
  #authGate .modal-card{
    position:fixed; z-index:50; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(420px, calc(100vw - 32px));
    background:var(--k-surface); border:1px solid var(--k-border); border-radius:var(--k-radius-lg); box-shadow:var(--shadow-modal); padding:24px;
    display:flex; flex-direction:column;
  }
  #modalRoot h2{font-size:17px;}
  /* Every form row was a direct block child of <form> with zero rule
     spacing them apart - labels measured back-to-back at 0px gap, touching
     edge to edge despite looking "roomy enough" in a screenshot. This is
     what actually read as cramped/hard-to-use, more than any single field. */
  form{display:flex; flex-direction:column; gap:16px;}
  form label{display:flex; flex-direction:column; gap:6px; font:600 13px/1.3 var(--k-font-sans); color:var(--k-ink);}
  .qmark{
    display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%;
    background:var(--surface-raised); border:1px solid var(--border); color:var(--ink-secondary);
    font-size:10px; font-weight:700; cursor:help; flex:none; padding:0; font-family:inherit; position:relative;
  }
  .qmark::after{content:""; position:absolute; inset:-14px;} /* 44px tap area around the 16px mark */
  .label-row{display:inline-flex; align-items:center; gap:5px;}
  /* 16px is the floor iOS Safari uses to decide whether to auto-zoom a
     focused field - anything smaller and tapping into any form on a phone
     (adding an ingredient, logging a count, anything) yanks the whole page
     in. Was 13.5px. */
  form input, form select, form textarea{
    border:1px solid var(--k-border-input); border-radius:var(--k-radius); padding:10px 12px; min-height:var(--k-tap); background:var(--k-surface); color:var(--k-ink); font:16px/1.3 var(--k-font-sans); width:100%;
  }
  form textarea{min-height:80px;}
  form input:focus-visible, form select:focus-visible, form textarea:focus-visible{outline:2px solid var(--k-ring); outline-offset:2px;}
  input::placeholder, textarea::placeholder{color:var(--k-muted);}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
  @media (max-width:480px){ .grid2, .grid3{grid-template-columns:1fr;} }
  .hint{font-size:13px; color:var(--k-muted);}
  .modal-actions{display:flex; align-items:center; justify-content:space-between; gap:10px; padding-top:6px; border-top:1px solid var(--border);}
  .modal-actions .right{display:flex; gap:8px;}
  /* Save/Cancel stay pinned to the bottom of the scrolling modal card so a
     long form never hides them below the fold (phone, iPad landscape). */
  #modalRoot .modal-actions{position:sticky; bottom:-20px; z-index:2; background:var(--k-surface); margin:0 -20px -20px; padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px)); box-shadow:0 -8px 16px -12px rgba(0,0,0,0.6);}
  .line-row{display:grid; grid-template-columns:1fr 110px 90px auto; gap:8px; align-items:end; padding:8px 0; border-bottom:1px solid var(--border);}
  .line-row:last-child{border-bottom:none;}
  @media (max-width:480px){
    /* Several call sites set grid-template-columns inline (JS-built rows with
       varying field counts), which always wins over a stylesheet rule - even
       one in a media query - so this narrow-screen fallback needs !important
       to actually override them. Without it, an invoice/PO line row keeps its
       5-column desktop grid on a phone and the ingredient picker shrinks to
       a few unreadable characters instead of wrapping. */
    .line-row{grid-template-columns:1fr 1fr!important; grid-template-areas:"a a" "b c" "d d";}
  }
  .line-total{font-family:var(--font-mono); font-size:13px; color:var(--ink-secondary); align-self:center; text-align:right;}
  .lines-box{border:1px solid var(--border); border-radius:10px; padding:10px 12px; max-height:280px; overflow-y:auto;}
  .cost-preview{display:flex; justify-content:space-between; align-items:center; background:var(--k-raised); border-radius:var(--k-radius); padding:10px 14px; font-size:13px;}
  .cost-preview strong{font-family:var(--font-mono); font-size:16px; color:var(--accent-strong);}
  /* --ink-muted reads fine on the page/card grounds .hint is normally on,
     but not on this tinted pill - it measured 4.14 here. */
  .cost-preview .hint{color:var(--ink-secondary);}
  fieldset{border:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px;}

  /* charts */
  .chart-card svg{width:100%; height:auto; display:block; overflow:visible;}
  .chart-tooltip{position:absolute; pointer-events:none; background:var(--k-raised); border:1px solid var(--k-border); color:var(--k-ink); font-size:12px; padding:6px 9px; border-radius:var(--k-radius); white-space:nowrap; box-shadow:var(--shadow-card); transform:translate(-50%,-115%); z-index:5;}
  .chart-wrap{position:relative;}
  .legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-secondary); margin-top:8px;}
  .legend .item{display:flex; align-items:center; gap:6px;}
  .legend .swatch{width:10px; height:10px; border-radius:3px; flex:none;}
  .two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:14px;}
  @media (max-width:860px){ .two-col{grid-template-columns:1fr;} }
  .attn-item{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); font-size:13px;}
  .attn-item:last-child{border-bottom:none;}
  .attn-card{border-color:var(--k-warning);}
  .attn-dot{width:8px; height:8px; border-radius:50%; flex:none; background:var(--ink-muted);}
  .attn-dot.critical{background:var(--critical);}
  .attn-dot.serious{background:var(--serious);}
  .attn-dot.warning{background:var(--warning);}
  .attn-body{flex:1; min-width:0;}
  .attn-item .t{font-weight:600; color:var(--ink);}
  .attn-item .s{color:var(--ink-secondary); font-size:12px; margin-top:1px;}

  .dept-bar{display:flex; height:10px; border-radius:100px; overflow:hidden; background:var(--border); margin:4px 0 16px;}
  .dept-bar .seg{height:100%;}
  .dept-bar .seg.food{background:var(--accent);}
  .dept-bar .seg.bev{background:color-mix(in srgb, var(--accent) 62%, var(--ink-muted));}
  .dept-bar .seg.sup{background:var(--ink-muted);}
  .dept-rows{display:flex; flex-direction:column; gap:10px;}
  .dept-row{display:grid; grid-template-columns:12px auto 1fr auto; align-items:center; gap:8px; font-size:13px;}
  .dept-dot{width:8px; height:8px; border-radius:50%;}
  .dept-dot.food{background:var(--accent);}
  .dept-dot.bev{background:color-mix(in srgb, var(--accent) 62%, var(--ink-muted));}
  .dept-dot.sup{background:var(--ink-muted);}
  .dept-name{font-weight:600; color:var(--ink);}
  .dept-num{font-family:var(--font-mono); font-variant-numeric:tabular-nums; font-weight:600; text-align:right;}
  .dept-sub{color:var(--ink-secondary); font-size:12px; text-align:right; white-space:nowrap;}
  @media (max-width:480px){ .dept-row{grid-template-columns:12px auto auto; grid-template-areas:"dot name num" ". sub sub"; row-gap:2px;} .dept-sub{grid-area:sub; text-align:left;} }
  .attn-item:last-child{border-bottom:none;}
  .attn-item .t{font-weight:600;}
  .attn-item .s{color:var(--ink-muted); font-size:12px;}
  .vendor-group{margin-bottom:16px;}
  .vendor-group h3{font-size:14px; margin-bottom:8px; display:flex; align-items:center; gap:8px;}
  .inline-label{display:inline-flex; align-items:center; gap:6px;}
  .filter-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .combo-wrap{position:relative;}

function nyDate(ms){
  var p = {}; new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'})

/* ---------------- calc helpers ---------------- */
function unitCostOf(ing){ var upp = num(ing.unitsPerPack); return upp>0 ? num(ing.costPerPack)/upp : 0; }

function defaultDept(category){
  if(category==='Wine' || category==='Liquor' || category==='Beer' || category==='N/A Bev') return 'Beverage';
  if(category==='Maintenance' || category==='Non-Food/Bev' || category==='Other') return 'Supplies';
  return 'Food';
}
function purchaseCategoryOf(ing){
  var cat = ing ? ing.category : null;
  switch(cat){
    case 'Wine': case 'Liquor': case 'Beer': case 'N/A Bev': case 'Non-Food/Bev': case 'Maintenance': case 'Dry Goods':
      return cat;
    default:
      return 'Food';
  }
}
function defaultRecipeDept(category){ return category==='Beverage' ? 'Beverage' : 'Food'; }
function ingDept(ing){ return ing ? (ing.department || defaultDept(ing.category)) : 'Food'; }
function ingDeptById(id){ return ingDept(byId(state.ingredients, id)); }
function recipeDept(r){ return r ? (r.department || defaultRecipeDept(r.category)) : 'Food'; }
function departmentStats(dept){
  var ings = state.ingredients.filter(function(i){ return ingDept(i)===dept; });
  var recs = state.recipes.filter(function(r){ return recipeDept(r)===dept && num(r.menuPrice)>0; });
  return {
    inventoryValue: sum(ings, ingredientValue),
    itemCount: ings.length,
    avgCostPct: recs.length ? sum(recs, recipeFoodCostPct)/recs.length : 0,
    recipeCount: recs.length
  };
}
function recipeIngredientCost(recipe){
  return sum(recipe.lines||[], function(line){
    var ing = byId(state.ingredients, line.ingredientId);
    return ing ? num(line.qty) * unitCostOf(ing) : 0;
  });
}
function recipePortionCost(recipe){
  var y = num(recipe.yieldQty) || 1;
  return recipeIngredientCost(recipe) / y;
}
function recipeFoodCostPct(recipe){
  var price = num(recipe.menuPrice);
  if(!price) return 0;
  return recipePortionCost(recipe) / price * 100;
}
function currentInventoryValue(){ return sum(state.ingredients, ingredientValue); }
// Estimate an ingredient's daily consumption from consecutive inventory
// counts that recorded it. Anything received via a PO between two counts is
// credited back before the drop counts as usage, so a delivery doesn't read
// as a huge burn day. Needs at least two counts covering this ingredient —
// with only one (or none), there is nothing to measure a rate from yet.
function ingredientUsageRate(ingredientId){
  var series = state.counts.map(function(c){
    var line = (c.lines||[]).filter(function(l){ return l.ingredientId===ingredientId; })[0];
    return line ? {date:new Date(c.date).getTime(), qty:num(line.countedQty)} : null;
  }).filter(Boolean).sort(function(a,b){ return a.date-b.date; });
  if(series.length < 2) return null;

  var consumed = 0, days = 0;
  for(var i=1;i<series.length;i++){
    var a = series[i-1], b = series[i];
    var span = (b.date - a.date) / DAY;
    if(span <= 0) continue;
    var received = sum(state.pos.filter(function(po){
      if(po.status!=='received' || !po.receivedAt) return false;
      var t = new Date(po.receivedAt).getTime();
      return t > a.date && t <= b.date;
    }), function(po){
      return sum((po.lines||[]).filter(function(l){ return l.ingredientId===ingredientId; }), function(l){ return num(l.qty); });
    });
    consumed += (a.qty + received - b.qty);
    days += span;
  }

// How urgent reordering this ingredient is. Prefers the measured usage rate;
// falls back to a flat par-level check when there isn't enough count history
// yet to measure one (the day-one case, before usage data has accumulated).
function stockRisk(ing){
  var usage = ingredientUsageRate(ing.id);
  if(usage && usage.dailyRate > 0.0001){
    var daysLeft = num(ing.onHand) / usage.dailyRate;
    var level = daysLeft <= REORDER_LEAD_DAYS ? 'critical' : (daysLeft <= REORDER_LEAD_DAYS*2 ? 'warning' : 'ok');
    return {level:level, daysLeft:daysLeft, method:'usage', dailyRate:usage.dailyRate};
  }
  var par = num(ing.parLevel);
  if(par > 0 && num(ing.onHand) < par){
    var ratio = num(ing.onHand)/par;
    return {level: ratio<0.5?'critical':'warning', daysLeft:null, method:'par', ratio:ratio};
  }
  return {level:'ok', daysLeft:null, method:'par', ratio: par>0 ? num(ing.onHand)/par : null};
}

// All ingredients worth a look, most urgent first: usage-predicted stockouts
// (sorted by days left) ahead of plain par-level flags (sorted by how far
// under par), critical before warning within each.
function stockRiskIngredients(){
  var scored = state.ingredients.map(function(i){ return {ing:i, risk:stockRisk(i)}; }).filter(function(x){ return x.risk.level!=='ok'; });
  var byMethodThenUrgency = function(x){ return x.risk.method==='usage' ? x.risk.daysLeft : (x.risk.ratio*100 + 1000); };
  var critical = scored.filter(function(x){ return x.risk.level==='critical'; }).sort(function(a,b){ return byMethodThenUrgency(a)-byMethodThenUrgency(b); });
  var warning = scored.filter(function(x){ return x.risk.level==='warning'; }).sort(function(a,b){ return byMethodThenUrgency(a)-byMethodThenUrgency(b); });
  return critical.concat(warning);
}
function recentPriceIncreases(days){
  days = days||30;

  var out = [];
  state.ingredients.forEach(function(ing){
    var hist = (ing.priceHistory||[]).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
    if(hist.length < 2) return;
    var latest = hist[hist.length-1], prev = hist[hist.length-2];
    if(new Date(latest.date).getTime() < cutoff) return;
    if(latest.costPerUnit > prev.costPerUnit){
      out.push({ing:ing, from:prev.costPerUnit, to:latest.costPerUnit, pctChange:(latest.costPerUnit-prev.costPerUnit)/prev.costPerUnit*100, date:latest.date});
    }
  });
  return out.sort(function(a,b){ return b.pctChange - a.pctChange; });
}
function overTargetRecipes(){
  return state.recipes.filter(function(r){ return recipeFoodCostPct(r) > num(r.targetFoodCostPct || 30); })
    .sort(function(a,b){ return recipeFoodCostPct(b) - recipeFoodCostPct(a); });
}
function avgFoodCostPct(){
  var withPrice = state.recipes.filter(function(r){ return num(r.menuPrice)>0; });
  if(!withPrice.length) return 0;

function orderGuide(){
  var byVendor = {};

    // (no par level yet, or par understates real velocity), order enough to
    // cover PAR_COVER_DAYS at the measured rate instead.
    var target = num(ing.parLevel);

    if(COUNT_UNITS.indexOf(String(ing.invUnit||'').trim().toLowerCase()) >= 0) need = Math.ceil(need - 1e-9);

    (byVendor[v] = byVendor[v] || []).push({ing:ing, qty:need, cost:need*unitCostOf(ing), risk:risk});
  });

}

  var set = {};

  state.pos.forEach(function(po){ if(po.vendor) set[po.vendor] = true; });
  return Object.keys(set).sort(function(a,b){ return a.localeCompare(b); });

function poTotal(po){ return sum(po.lines||[], function(l){ return num(l.qty)*num(l.unitCost); }); }
function poTotalForDept(po, dept){
  if(!dept || dept==='All') return poTotal(po);

}
function countTotalForDept(count, dept){
  if(!dept || dept==='All') return num(count.totalValue);
  return sum((count.lines||[]).filter(function(l){ return ingDeptById(l.ingredientId)===dept; }), function(l){ return num(l.extValue); });
}

function presetRange(key){
  var now = new Date();
  if(key==='thisWeek') return [startOfWeek(now), endOfWeek(now)];
  if(key==='lastWeek'){ var s = startOfWeek(now); s.setDate(s.getDate()-7); return [s, endOfWeek(s)]; }
  if(key==='thisMonth') return [startOfMonth(now), endOfMonth(now)];
  if(key==='lastMonth'){ var sm = new Date(now.getFullYear(), now.getMonth()-1, 1); return [sm, endOfMonth(sm)]; }
  return null;
}
function purchaseLinesInRange(startVal, endVal){
  var startT = new Date(startVal).getTime();
  var endT = new Date(endVal).getTime() + DAY - 1;
  var out = [];
  if(isNaN(startT) || isNaN(endT)) return out;
  state.pos.forEach(function(po){
    if(po.status !== 'received') return;
    var t = new Date(po.receivedAt || po.date).getTime();
    if(isNaN(t) || t < startT || t > endT) return;
    (po.lines||[]).forEach(function(l){ out.push({po:po, line:l, amount: num(l.qty)*num(l.unitCost)}); });
  });
  return out;
}
function purchaseReportData(startVal, endVal){
  var totals = {Food:0, 'Wine':0, 'Liquor':0, 'Beer':0, 'N/A Bev':0, 'Non-Food/Bev':0, 'Maintenance':0, 'Dry Goods':0};
  var all = 0;
  purchaseLinesInRange(startVal, endVal).forEach(function(x){
    var ing = byId(state.ingredients, x.line.ingredientId);
    var cat = purchaseCategoryOf(ing);
    totals[cat] = (totals[cat]||0) + x.amount;
    all += x.amount;
  });
  return {
    all: round2(all),
    food: round2(totals['Food']),
    bev: round2(totals['Wine']+totals['Liquor']+totals['Beer']+totals['N/A Bev']),
    wine: round2(totals['Wine']), liquor: round2(totals['Liquor']), beer: round2(totals['Beer']), naBev: round2(totals['N/A Bev']),
    nonFoodBev: round2(totals['Non-Food/Bev']), maintenance: round2(totals['Maintenance']), dryGoods: round2(totals['Dry Goods'])
  };
}

/* ---------------- db bootstrap ---------------- */
function subscribeCollection(name){
  db.collection(name).onSnapshot(function(snap){
    state[name] = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    state.ready[name] = true;
    render();
  }, function(err){
    console.error('db error', name, err);
    toast('Couldn\'t sync ' + name + '. Refresh the page to try again.');
  });
}

// There is deliberately no seedIfEmpty() that writes buildSeed()'s fabricated
// example data into the real database. That data is invented for the preview
// screen only - it doesn't match iara's real menu (checked against
// iara_staff_hub.html's actual dish list: names, prices, even which dishes
// exist all differ) - and Firestore has no way to tell "real empty database"
// from "empty because nobody has entered real data yet". Auto-writing on
// first manager sign-in would have made the fake data permanent production
// data the moment anyone signed in. Real ingredients/recipes/counts get
// entered by hand or via a real reconciliation pipeline, never by a client
// script guessing the database is ready to be filled.

function loadLocalFallback(){
  var seed = buildSeed();
  state.ingredients = seed.ingredients; state.recipes = seed.recipes; state.counts = seed.counts;
  state.pos = seed.pos; state.sales = seed.sales;
  state.ready = {ingredients:true, recipes:true, counts:true, pos:true, sales:true};
}

function startSync(){
  state.dbAvailable = true;
  updateSyncChip(true);
  hideAuthGate();
  ['ingredients','recipes','counts','pos','sales'].forEach(subscribeCollection);
}

async function initApp(){
  renderNav();
  render();
  try{
    db = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('db') : null;
  }catch(e){ db = null; }
  if(db){
    startSync();
  } else if(FIREBASE_CONFIG.apiKey !== "REPLACE_ME"){
    try{
      if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
      // A separate named app instance, matching iara_staff_hub.html's manager
      // sign-in, so a session started there is picked up here too.
      adminApp = firebase.apps.filter(function(a){ return a.name === "manager"; })[0]
              || firebase.initializeApp(FIREBASE_CONFIG, "manager");
      adminAuth = adminApp.auth();
      state.dbAvailable = false;
      updateSyncChip(false);
      adminAuth.onAuthStateChanged(function(u){
        if(u && isManagerEmail(u.email)){
          adminUser = u;
          db = adminApp.firestore();
          startSync();
        } else {
          adminUser = null;
          db = null;
          state.dbAvailable = false;
          updateSyncChip(false);
          loadLocalFallback();
          render();
          showAuthGate();
        }
      });
    }catch(e){
      adminApp = null; adminAuth = null;
      state.dbAvailable = false;
      updateSyncChip(false);
      loadLocalFallback();
      render();
    }
  } else {
    state.dbAvailable = false;
    updateSyncChip(false);
    loadLocalFallback();
    render();
  }
  try{
    sampleFn = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('sample') : null;
  }catch(e){ sampleFn = null; }
  if(sampleFn){
    try{ state.sampleCaps = await sampleFn.limits(); }catch(e){ state.sampleCaps = null; }
  }
  try{
    assetsApi = (window.claude && typeof window.claude.use === 'function') ? await window.claude.use('assets') : null;
  }catch(e){ assetsApi = null; }
  state.assetsAvailable = !!assetsApi;
}

/* ---------------- mutations ---------------- */
function persistCollection(name, id, body){
  if(db){ return db.collection(name).doc(id).set(body).catch(function(e){ console.error(e); toast('Couldn\'t save. Check your connection and try again.'); }); }
  var arr = state[name];
  var idx = arr.findIndex(function(x){ return x.id===id; });
  var doc = Object.assign({id:id}, body);
  if(idx>=0) arr[idx]=doc; else arr.push(doc);
  render();
  return Promise.resolve();
}
function updateCollection(name, id, patch){
  if(db){ return db.collection(name).doc(id).update(patch).catch(function(e){ console.error(e); toast('Couldn\'t save. Check your connection and try again.'); }); }
  var arr = state[name]; var doc = byId(arr, id); if(doc) Object.assign(doc, patch); render(); return Promise.resolve();
}
function deleteFromCollection(name, id){
  if(db){ return db.collection(name).doc(id).delete().catch(function(e){ console.error(e); toast('Couldn\'t delete. Check your connection and try again.'); }); }
  state[name] = state[name].filter(function(x){ return x.id!==id; }); render(); return Promise.resolve();
}

function saveIngredient(form){
  var fd = new FormData(form);
  var id = form.dataset.id || uid();
  var existing = byId(state.ingredients, form.dataset.id);
  var costPerPack = parseFloat(fd.get('costPerPack'))||0;
  var unitsPerPack = parseFloat(fd.get('unitsPerPack'))||1;
  var newUnitCost = round2(costPerPack/unitsPerPack);
  var body = {
    name: fd.get('name').trim(), category: fd.get('category'), vendor: fd.get('vendor').trim(),
    invUnit: fd.get('invUnit'), unitsPerPack: unitsPerPack, costPerPack: round2(costPerPack),
    parLevel: parseFloat(fd.get('parLevel'))||0, onHand: parseFloat(fd.get('onHand'))||0,
    storageArea: fd.get('storageArea'), department: fd.get('department') || defaultDept(fd.get('category'))
  };
  var hist = existing ? (existing.priceHistory||[]).slice() : [];
  var lastCost = hist.length ? hist[hist.length-1].costPerUnit : null;
  if(lastCost == null || Math.abs(lastCost - newUnitCost) > 0.0001){
    hist.push({date: isoNow(), costPerPack: body.costPerPack, costPerUnit: newUnitCost});
  }
  body.priceHistory = hist;
  body.createdAt = existing ? existing.createdAt : isoNow();
  persistCollection('ingredients', id, body).then(function(){
    toast(existing ? 'Ingredient updated' : 'Ingredient added'); closeModal();
  });
}

function saveRecipe(form, linesData){
  var fd = new FormData(form);
  var id = form.dataset.id || uid();
  var existing = !!form.dataset.id;
  var body = {
    name: fd.get('name').trim(), category: fd.get('category'),
    department: fd.get('department') || defaultRecipeDept(fd.get('category')),

function saveCount(label, dateVal, linesArr){

function savePO(vendor, dateVal, linesArr){
  var body = {date: new Date(dateVal).toISOString(), vendor: vendor, status:'draft', lines: linesArr};
  persistCollection('pos', uid(), body).then(function(){ toast('Purchase order created'); closeModal(); });
}
function applyReceivedEffects(po, skipIds){
  skipIds = skipIds || {};
  (po.lines||[]).forEach(function(line){
    if(skipIds[line.ingredientId]) return;
    var ing = byId(state.ingredients, line.ingredientId);
    if(!ing) return;
    var newOnHand = round2(num(ing.onHand) + num(line.qty));
    var patch = {onHand: newOnHand};
    var curUnitCost = unitCostOf(ing);
    if(Math.abs(curUnitCost - num(line.unitCost)) > 0.0001 && num(line.unitCost) > 0){
      patch.costPerPack = round2(num(line.unitCost) * num(ing.unitsPerPack));
      var hist = (ing.priceHistory||[]).slice();
      hist.push({date: isoNow(), costPerPack: patch.costPerPack, costPerUnit: round2(num(line.unitCost))});
      patch.priceHistory = hist;
    }
    updateCollection('ingredients', ing.id, patch);
  });
}
function setPOStatus(id, status){
  var po = byId(state.pos, id); if(!po) return;
  if(status === 'received'){
    applyReceivedEffects(po);
    updateCollection('pos', id, {status:'received', receivedAt: isoNow()}).then(function(){ toast('Purchase order received. Inventory updated.'); });
  } else {
    updateCollection('pos', id, {status:status}).then(function(){ toast('Purchase order marked ' + status + '.'); });
  }
}
function saveInvoicePO(vendor, dateVal, linesArr, assetId, skipIds){
  var body = {date: new Date(dateVal).toISOString(), vendor: vendor, status:'received', receivedAt: isoNow(), lines: linesArr, fromInvoice:true};
  if(assetId) body.receiptAssetId = assetId;
  applyReceivedEffects(body, skipIds);
  persistCollection('pos', uid(), body).then(function(){ toast('Invoice saved: inventory updated'); closeModal(); });
}

function saveSales(dateFrom, dateTo, label, linesArr){
  var body = {dateFrom: new Date(dateFrom).toISOString(), dateTo: new Date(dateTo).toISOString(), label: label || (dateShort(new Date(dateFrom).toISOString())+' to '+dateShort(new Date(dateTo).toISOString())), lines: linesArr.filter(function(l){ return num(l.qty)>0; })};
  persistCollection('sales', uid(), body).then(function(){ toast('Sales logged'); closeModal(); });
}

/* ---------------- charts ---------------- */
function lineChartSvg(points, opts){
  opts = opts||{};
  var w = 640, h = 220, padL = 46, padR = 16, padT = 16, padB = 28;
  var vals = points.map(function(p){ return p.y; });
  var maxV = Math.max.apply(null, vals.concat([0])) * 1.15 || 1;
  var minV = Math.min(0, Math.min.apply(null, vals));
  var span = (maxV-minV) || 1;
  var innerW = w-padL-padR, innerH = h-padT-padB;
  function X(i){ return padL + (points.length<=1 ? innerW/2 : (i/(points.length-1))*innerW); }
  function Y(v){ return padT + innerH - ((v-minV)/span)*innerH; }
  var gridLines = 4, gridHtml = '';
  for(var g=0; g<=gridLines; g++){
    var v = minV + (span*g/gridLines);
    var y = Y(v);
    gridHtml += '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>';
    gridHtml += '<text x="'+(padL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--ink-muted)" font-family="var(--font-mono)">'+moneyShort(v)+'</text>';
  }
  var pathD = points.map(function(p,i){ return (i===0?'M':'L') + X(i).toFixed(1) + ',' + Y(p.y).toFixed(1); }).join(' ');
  var areaD = pathD + ' L' + X(points.length-1).toFixed(1) + ',' + Y(minV).toFixed(1) + ' L' + X(0).toFixed(1) + ',' + Y(minV).toFixed(1) + ' Z';
  var dots = points.map(function(p,i){
    var last = i===points.length-1;
    return '<circle class="pt" data-i="'+i+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(last?5:3.5)+'" fill="var(--accent)" stroke="var(--surface-raised)" stroke-width="'+(last?2:1.5)+'"/>';
  }).join('');
  var xLabels = points.map(function(p,i){
    if(points.length>1 && i!==0 && i!==points.length-1 && points.length>6 && i%Math.ceil(points.length/6)!==0) return '';
    return '<text x="'+X(i).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10.5" fill="var(--ink-muted)">'+esc(p.label)+'</text>';
  }).join('');
  var hitAreas = points.map(function(p,i){
    return '<rect data-i="'+i+'" x="'+(X(i)-innerW/Math.max(points.length,1)/2).toFixed(1)+'" y="0" width="'+(innerW/Math.max(points.length,1)).toFixed(1)+'" height="'+h+'" fill="transparent" class="hit"/>';
  }).join('');
  return {
    svg: '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(opts.label||'Line chart')+'">'+gridHtml+'<path d="'+areaD+'" fill="var(--accent)" opacity="0.10" stroke="none"/><path d="'+pathD+'" fill="none" stroke="var(--accent)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>'+dots+xLabels+hitAreas+'</svg>',
    points: points, X:X, Y:Y
  };
}
function moneyShort(n){ n=num(n); if(Math.abs(n)>=1000) return '$'+(n/1000).toFixed(1)+'k'; return '$'+Math.round(n); }

function attachLineTooltip(container, points){
  var wrap = container.querySelector('.chart-wrap');
  var svg = container.querySelector('svg');
  if(!wrap || !svg) return;
  var tip = document.createElement('div'); tip.className='chart-tooltip'; tip.hidden = true; wrap.appendChild(tip);
  svg.addEventListener('mousemove', function(e){
    var rect = svg.getBoundingClientRect();
    var t = e.target.closest('.hit');
    if(!t){ tip.hidden = true; return; }
    var i = +t.dataset.i; var p = points[i]; if(!p){ tip.hidden=true; return; }
    var dot = svg.querySelector('circle[data-i="'+i+'"]');
    var bb = dot.getBoundingClientRect();
    tip.style.left = (bb.left - rect.left + bb.width/2) + 'px';
    tip.style.top = (bb.top - rect.top) + 'px';
    tip.textContent = p.label + ' · ' + money(p.y);
    tip.hidden = false;
  });
  svg.addEventListener('mouseleave', function(){ tip.hidden = true; });
}

function barChartSvg(data, opts){
  opts = opts||{};
  var w = 640, h = 220, padL = 46, padR = 16, padT = 16, padB = 34;
  var maxV = Math.max.apply(null, data.map(function(d){ return d.y; }).concat([0.0001])) * 1.15;
  var innerW = w-padL-padR, innerH = h-padT-padB;
  var n = data.length || 1;
  var slot = innerW/n, barW = Math.min(46, slot*0.55);
  function Y(v){ return padT + innerH - (v/maxV)*innerH; }
  var gridHtml = '';
  for(var g=0; g<=4; g++){ var v = maxV*g/4; var y=Y(v); gridHtml += '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--grid)" stroke-width="1"/>'; gridHtml += '<text x="'+(padL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10.5" fill="var(--ink-muted)" font-family="var(--font-mono)">'+(opts.pctAxis? Math.round(v)+'%' : moneyShort(v))+'</text>'; }
  var bars = data.map(function(d,i){
    var cx = padL + slot*i + slot/2;
    var y = Y(d.y);
    var barH = (padT+innerH) - y;
    var color = d.color || 'var(--accent)';
    var label = opts.pctAxis ? pct(d.y,0) : money(d.y);
    return '<g class="bar" data-i="'+i+'">'+
      '<rect x="'+(cx-barW/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+Math.max(barH,0).toFixed(1)+'" rx="4" fill="'+color+'"><title>'+esc(d.label)+': '+label+'</title></rect>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+'" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="var(--ink-secondary)">'+label+'</text>'+
      '<text x="'+cx.toFixed(1)+'" y="'+(h-10)+'" text-anchor="middle" font-size="10.5" fill="var(--ink-muted)">'+truncateLabel(d.label)+'</text>'+
      '</g>';
  }).join('');
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(opts.label||'Bar chart')+'">'+gridHtml+bars+
    (opts.targetY!=null ? '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+Y(opts.targetY).toFixed(1)+'" y2="'+Y(opts.targetY).toFixed(1)+'" stroke="var(--critical)" stroke-width="1.5" stroke-dasharray="4 3"/>' : '')
    +'</svg>';
}
function truncateLabel(s){ s = String(s); return s.length>14 ? esc(s.slice(0,13))+'…' : esc(s); }

  html += '<div class="card'+(attn.length?' attn-card':'')+'"><div class="section-title">Needs Attention</div>' + (attn.length ? attn.slice(0,6).map(function(a){

  html += '<div class="kpis">'+
    '<div class="kpi"><div class="label">Inventory Value</div><div class="value">'+money(invVal)+'</div><div class="foot">'+plural(state.ingredients.length,'item')+' tracked</div></div>'+
    '<div class="kpi'+(afc>30?' alert':'')+'"><div class="label">Average Food Cost</div><div class="value">'+pct(afc)+'</div><div class="foot">across '+plural(state.recipes.length,'recipe')+'</div></div>'+
    '<div class="kpi'+(low.length?' alert':'')+'"><div class="label">Low Stock Items</div><div class="value">'+low.length+'</div><div class="foot">at risk of stockout</div></div>'+
    '<div class="kpi'+(incr.length?' alert':'')+'"><div class="label">Price Increases</div><div class="value">'+incr.length+'</div><div class="foot">last 30 days</div></div>'+
  '</div>';

  html += '<div class="two-col">';

  var deptTotal = Math.max(0.01, foodStats.inventoryValue + bevStats.inventoryValue + supStats.inventoryValue);

function pricingFilteredIngredients(){
  var q = (state.priceSearch||'').trim().toLowerCase();
  var rows = state.ingredients.filter(function(i){
    return !q || i.name.toLowerCase().indexOf(q)!==-1 || (i.vendor||'').toLowerCase().indexOf(q)!==-1;
  });
  return applySort(rows, state.pricingSort, {
    name: function(i){ return i.name.toLowerCase(); },
    vendor: function(i){ return (i.vendor||'').toLowerCase(); },
    unitCost: function(i){ return unitCostOf(i); },
    trend: function(i){
      var hist = (i.priceHistory||[]).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
      if(hist.length<2) return 0;
      var prevC = hist[hist.length-2].costPerUnit, lastC = hist[hist.length-1].costPerUnit;
      return prevC ? (lastC-prevC)/prevC : 0;
    }
  });
}
function pricingResultsHtml(){
  var list = pricingFilteredIngredients();
  if(!list.length) return '<div class="card empty-state">No ingredients match "'+esc(state.priceSearch)+'". Try a shorter word.</div>';
  var s = state.pricingSort;
  return '<div class="table-wrap"><table><thead><tr>'+
    sortTh('Item','pricing','name',s)+sortTh('Vendor','pricing','vendor',s)+sortTh('Current Cost','pricing','unitCost',s,'num')+sortTh('Trend','pricing','trend',s)+
    '<th></th></tr></thead><tbody>' +
    list.map(function(ing){
      var hist = (ing.priceHistory||[]).slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
      var trend = '<span class="badge neutral">No Data</span>';
      if(hist.length>=2){
        var prevC = hist[hist.length-2].costPerUnit, lastC = hist[hist.length-1].costPerUnit;
        var delta = lastC - prevC;
        if(Math.abs(delta) < 0.0001) trend = '<span class="badge neutral">Flat</span>';
        else if(delta>0) trend = '<span class="badge serious">▲ '+pct(Math.abs(delta/prevC*100),1)+'</span>';
        else trend = '<span class="badge good">▼ '+pct(Math.abs(delta/prevC*100),1)+'</span>';
      }
      var selected = state.priceSelectedId===ing.id;
      return '<tr><td>'+esc(ing.name)+'</td><td>'+esc(ing.vendor||'None')+'</td><td class="num">'+money(unitCostOf(ing))+'/'+esc(ing.invUnit)+'</td><td>'+trend+'</td>'+

}

function renderVarianceCard(){
  var sortedCounts = state.counts.slice().sort(function(a,b){ return new Date(a.date)-new Date(b.date); });
  if(sortedCounts.length < 2){
    return '<div class="card"><div class="section-title">Theoretical vs. Actual COGS</div><div class="empty-state">Save at least 2 inventory counts to see the variance.</div></div>';
  }
  var beginId = state.varianceBegin || sortedCounts[0].id;
  var endId = state.varianceEnd || sortedCounts[sortedCounts.length-1].id;
  var begin = byId(sortedCounts, beginId) || sortedCounts[0];
  var end = byId(sortedCounts, endId) || sortedCounts[sortedCounts.length-1];

  var options = sortedCounts.map(function(c){ return {id:c.id, label:dateLong(c.date)+': '+esc(c.label)}; });
  var beginSel = '<select data-action="varianceBegin">' + options.map(function(o){ return '<option value="'+o.id+'" '+(o.id===begin.id?'selected':'')+'>'+o.label+'</option>'; }).join('') + '</select>';
  var endSel = '<select data-action="varianceEnd">' + options.map(function(o){ return '<option value="'+o.id+'" '+(o.id===end.id?'selected':'')+'>'+o.label+'</option>'; }).join('') + '</select>';
  var dept = state.varianceDept || 'All';
  var deptSel = '<select data-action="varianceDept">' + ['All'].concat(DEPARTMENTS).map(function(d){ return '<option '+(d===dept?'selected':'')+'>'+d+'</option>'; }).join('') + '</select>';

  var t0 = new Date(begin.date).getTime(), t1 = new Date(end.date).getTime();
  var purchasesValue = sum(state.pos.filter(function(po){ return po.status==='received' && po.receivedAt && new Date(po.receivedAt).getTime()>=t0 && new Date(po.receivedAt).getTime()<=t1; }), function(po){ return poTotalForDept(po, dept); });
  var theoretical = sum(state.sales.filter(function(s){ var d=new Date(s.dateTo||s.dateFrom).getTime(); return d>=t0 && d<=t1; }), function(s){
    return sum(s.lines||[], function(l){ var r = byId(state.recipes, l.recipeId); if(!r) return 0; if(dept!=='All' && recipeDept(r)!==dept) return 0; return num(l.qty)*recipePortionCost(r); });
  });
  var beginVal = countTotalForDept(begin, dept), endVal = countTotalForDept(end, dept);
  var actual = round2(beginVal + purchasesValue - endVal);
  var variance = round2(actual - theoretical);
  var variancePct = theoretical ? (variance/theoretical*100) : 0;
  var vClass = Math.abs(variancePct) < 5 ? 'good' : (Math.abs(variancePct) < 12 ? 'warning' : 'critical');

  var bars = barChartSvg([{label:'Theoretical', y:round2(theoretical), color:'var(--cat-1)'},{label:'Actual', y:actual, color:'var(--cat-2)'}], {label:'Theoretical vs. actual cost of goods sold'});

  return '<div class="card">'+
    '<div class="section-title">Theoretical vs. Actual COGS</div>'+
    '<div class="filter-row" style="margin-bottom:12px"><label class="inline-label">Start '+beginSel+'</label><label class="inline-label">End '+endSel+'</label><label class="inline-label">Department '+deptSel+'</label></div>'+
    '<div class="chart-wrap">'+bars+'</div>'+
    '<div class="grid3" style="margin-top:12px">'+
      '<div><div class="hint">Beginning + purchases − ending</div><div class="num" style="font-size:16px">'+money(actual)+' actual</div></div>'+
      '<div><div class="hint">From logged sales × plate cost</div><div class="num" style="font-size:16px">'+money(theoretical)+' theoretical</div></div>'+
      '<div><div class="hint">Variance</div><div class="num" style="font-size:16px"><span class="badge '+vClass+'">'+money(variance)+' ('+pct(variancePct,1)+')</span></div></div>'+
    '</div>'+
    '<div class="hint" style="margin-top:8px">Purchases counted: '+money(purchasesValue)+' from received POs in this window. Log sales for the same window for an accurate theoretical figure.</div>'+
  '</div>';
}

}

async function runInvoiceExtraction(){
  if(!sampleFn || !state.invoicePhoto) return;
  var area = $('#invoicePhotoArea');
  if(area) area.innerHTML = invoicePhotoAreaHtml() + '<div class="hint">Reading invoice…</div>';
  var ingredientHints = state.ingredients.map(function(i){ return i.name + ' ('+i.invUnit+')'; }).join(', ') || 'none tracked yet';
  var prompt = 'You are reading a photo of a restaurant supplier invoice or receipt. ' +
    'Extract the vendor name, the invoice date if visible (YYYY-MM-DD, or null if unclear), and every line item with: description (exactly as printed), quantity (number), unit (as printed, e.g. lb/case/each), and unitPrice (price per unit in USD — if only a line total is printed, compute unitPrice as the line total divided by quantity). ' +
    'We already track these ingredients by name and count unit: ' + ingredientHints + '. For each line item also include matchedIngredient: the exact name from that list if it clearly refers to the same product, else null. ' +
    'Reply with ONLY JSON in this exact shape, no other text: {"vendor": string, "invoiceDate": string|null, "lineItems": [{"description": string, "quantity": number, "unit": string, "unitPrice": number, "matchedIngredient": string|null}]}';
  try{
    var data = await sampleFn.json(prompt, {images: state.invoicePhoto, modelTier:'default'});
    renderInvoiceReview(data);
  }catch(e){
    console.error('invoice extraction failed', e);
    var msg = e.code==='not_granted' ? 'AI access was declined for this session: enter the order by hand below.' :
      e.code==='image_rejected' ? 'That photo couldn’t be read: try a clearer shot of the invoice.' :
      e.code==='rate_limited' ? 'Too many requests right now: try again shortly.' :
      'Couldn’t read that invoice automatically: enter it by hand below.';
    toast(msg);
    renderInvoiceReview(null);
  }
}

  state.tempLinesKind = 'invoice';
  var vendor = (data && data.vendor) || '';
  var dateGuess = (data && data.invoiceDate) || nyDate();
  state.tempLines = ((data && data.lineItems) || []).map(function(li){
    var match = li.matchedIngredient ? state.ingredients.filter(function(i){ return i.name.toLowerCase()===String(li.matchedIngredient).toLowerCase(); })[0] : null;
    return {description: li.description||'', ingredientId: match ? match.id : '', qty: num(li.quantity), unitCost: round2(num(li.unitPrice)), category: match ? match.category : 'Food'};
  });
  var unmatched = state.tempLines.filter(function(l){ return l.description && !l.ingredientId; }).length;
  var h = '<h2>Review Invoice</h2>'+
    (state.invoicePhotoUrl ? '<img src="'+state.invoicePhotoUrl+'" style="max-width:150px; max-height:150px; border-radius:8px; border:1px solid var(--border); object-fit:contain">' : '')+
    (unmatched ? '<p class="hint">'+unmatched+' '+(unmatched===1?'line':'lines')+' didn’t match an ingredient. Pick a match, or set a Category to add each one as a new item</p>' : '<p class="hint">Check each line’s Category: mixed invoices (e.g. limes/juices on a liquor bill) are common, and the category controls which purchase report an item counts toward.</p>')+
    '<form data-form="invoice">'+
    '<div class="grid2">'+
      '<label>Vendor<div class="combo-wrap">'+
        '<input required name="vendor" id="invoiceVendorInput" autocomplete="off" data-combo="vendor" value="'+esc(vendor)+'" placeholder="Search vendors…">'+
        '<span class="combo-caret">'+icon('chevronDown',14)+'</span>'+
        '<div class="combo-panel" id="vendorComboPanel" hidden></div>'+
      '</div></label>'+
      '<label>Date<input type="date" name="date" value="'+esc(dateGuess)+'"></label>'+
    '</div>'+
    '<div><div class="section-title">Line Items</div><div class="lines-box" id="linesBox" style="max-height:280px">'+invoiceLinesHtml(state.tempLines)+'</div>'+
    '<button type="button" class="k-btn k-btn-sm k-btn-ghost" data-action="addLine" style="margin-top:8px">+ Add Line</button></div>'+
    '<p class="hint">Saving creates a received purchase order: matched items restock on-hand and log any price change automatically. Unmatched lines are added as new ingredients using the quantity, cost and category shown.</p>'+
    '<div class="modal-actions"><span></span><div class="right"><button type="button" class="k-btn k-btn-ghost" data-action="closeModal">Cancel</button><button type="submit" class="k-btn k-btn-primary">Save Purchase Order</button></div></div>'+
    '</form>';
  openModal(h, true);
  var form = $('#modalRoot form');
  form.addEventListener('input', function(e){
    var f = e.target.dataset.lineField;
    if(!f) return;
    var idx = +e.target.dataset.idx;
    if(f==='qty'||f==='unitCost'){ state.tempLines[idx][f] = parseFloat(e.target.value)||0; }
    else if(f==='ingredientId'){
      state.tempLines[idx][f] = e.target.value;
      var matchedIng = byId(state.ingredients, e.target.value);
      if(matchedIng){ state.tempLines[idx].category = matchedIng.category; $('#linesBox').innerHTML = invoiceLinesHtml(state.tempLines); }
    } else {
      state.tempLines[idx][f] = e.target.value;
    }
  });
}

function openReceiptModal(assetId){
  var h = '<h2>Scanned Receipt</h2><img src="/_blob/'+esc(assetId)+'" style="max-width:100%; border-radius:8px; border:1px solid var(--border)">'+
    '<div class="modal-actions"><span></span><div class="right"><button type="button" class="k-btn k-btn-primary" data-action="closeModal">Close</button></div></div>';
  openModal(h, true);
}

function viewCountModal(count){
  var rows = (count.lines||[]).slice().sort(function(a,b){return a.name.localeCompare(b.name);}).map(function(l){
    return '<tr><td>'+esc(l.name)+'</td><td class="num">'+l.countedQty+' '+esc(l.unit)+'</td><td class="num">'+money(l.unitCost)+'</td><td class="num">'+money(l.extValue)+'</td></tr>';
  }).join('');
  var h = '<h2>'+esc(count.label)+'</h2><p class="hint">'+dateLong(count.date)+'</p>'+
    '<div class="table-wrap" style="max-height:400px; overflow-y:auto"><table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit Cost</th><th class="num">Line Value</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
    '<div class="cost-preview"><span>Total Value</span><strong>'+money(count.totalValue)+'</strong></div>'+
    '<div class="modal-actions"><button type="button" class="k-btn k-btn-danger" data-action="deleteCount" data-id="'+count.id+'">Delete Count</button><div class="right"><button type="button" class="k-btn k-btn-primary" data-action="closeModal">Close</button></div></div>';
  openModal(h, true);
}

/* ---------------- events ---------------- */
document.addEventListener('click', function(e){
  var t = e.target.closest('[data-action]');
  if(!t) return;
  var action = t.dataset.action;
  switch(action){
    case 'setTab': state.tab = t.dataset.tab; render(); break;
    case 'resetApp': state.tab = 'dashboard'; render(); window.scrollTo(0,0); break;
    case 'closeModal': closeModal(); break;
    case 'newIngredient': openIngredientModal(null); break;
    case 'editIngredient': openIngredientModal(byId(state.ingredients, t.dataset.id)); break;
    case 'deleteIngredient': { var delIng = byId(state.ingredients, t.dataset.id), delIngId = t.dataset.id;
      iaraConfirm({ title: 'Delete '+((delIng&&delIng.name)||'This Ingredient')+'?', body: 'This removes it from your ingredients for everyone. It can\'t be undone.', confirmLabel: 'Delete Ingredient', cancelLabel: 'Keep Ingredient' }).then(function(ok){
        if(ok){ deleteFromCollection('ingredients', delIngId).then(function(){ closeModal(); toast('Ingredient deleted'); }); } });
      break; }
    case 'newRecipe': openRecipeModal(null); break;
    case 'editRecipe': openRecipeModal(byId(state.recipes, t.dataset.id)); break;
    case 'deleteRecipe': { var delRec = byId(state.recipes, t.dataset.id), delRecId = t.dataset.id;
      iaraConfirm({ title: 'Delete '+((delRec&&delRec.name)||'This Recipe')+'?', body: 'This removes the recipe and its costing for everyone. It can\'t be undone.', confirmLabel: 'Delete Recipe', cancelLabel: 'Keep Recipe' }).then(function(ok){
        if(ok){ deleteFromCollection('recipes', delRecId).then(function(){ closeModal(); toast('Recipe deleted'); }); } });
      break; }
    case 'addLine':
      if(state.tempLinesKind==='invoice'){ state.tempLines.push({description:'', ingredientId:'', qty:0, unitCost:0, category:'Food'}); $('#linesBox').innerHTML = invoiceLinesHtml(state.tempLines); }
      else { state.tempLines.push({ingredientId:'', qty:0}); $('#linesBox').innerHTML = recipeLinesHtml(state.tempLines); recalcRecipePreview(); }
      break;
    case 'removeLine':
      state.tempLines.splice(+t.dataset.idx,1);
      if(state.tempLinesKind==='invoice'){ $('#linesBox').innerHTML = invoiceLinesHtml(state.tempLines); }
      else { $('#linesBox').innerHTML = recipeLinesHtml(state.tempLines); recalcRecipePreview(); }
      break;
    case 'newCount': openCountModal(); break;
    case 'viewCount': viewCountModal(byId(state.counts, t.dataset.id)); break;
    case 'deleteCount': { var delCnt = byId(state.counts, t.dataset.id), delCntId = t.dataset.id;
      iaraConfirm({ title: 'Delete '+((delCnt&&delCnt.label)||'This Count')+'?', body: 'This removes the count and its line values for everyone. It can\'t be undone.', confirmLabel: 'Delete Count', cancelLabel: 'Keep Count' }).then(function(ok){
        if(ok){ deleteFromCollection('counts', delCntId).then(function(){ closeModal(); toast('Count deleted'); }); } });
      break; }
    case 'createPoFromGuide': openPoModal(t.dataset.vendor); break;
    case 'poStatus': setPOStatus(t.dataset.id, t.dataset.status); break;
    case 'newSales': openSalesModal(); break;
    case 'setDeptFilter': state[t.dataset.key] = t.dataset.dept; render(); break;
    case 'setSort': {
      var scope = t.dataset.scope, key = t.dataset.key;
      var sortKey = scope + 'Sort';
      var cur = state[sortKey] || {key:null, dir:'asc'};
      if(cur.key===key){ cur = {key:key, dir: cur.dir==='asc' ? 'desc' : 'asc'}; } else { cur = {key:key, dir:'asc'}; }
      state[sortKey] = cur;
      var refreshers = {
        ingredients: renderIngredientsTableWrap,
        recipes: renderRecipesTableWrap,
        pos: renderPosTableWrap,
        counts: renderCountsTableWrap,
        pricing: renderPricingList,
        purchaseDrilldown: renderPurchaseDrilldownTableWrap
      };
      if(refreshers[scope]) refreshers[scope]();
      break;
    }
    case 'selectPriceItem': state.priceSelectedId = t.dataset.id; render(); break;
    case 'scanInvoice': openInvoiceModal(); break;
    case 'viewReceipt': openReceiptModal(t.dataset.assetId); break;
    case 'invoicePickPhoto': $('#invoicePhotoInput').click(); break;
    case 'invoiceExtract': runInvoiceExtraction(); break;
    case 'enterInvoiceManually': renderInvoiceReview(null); break;
    case 'pickVendorCombo': {
      var vendorInput = $('#invoiceVendorInput');
      if(vendorInput){ vendorInput.value = t.dataset.vendor; }
      closeVendorCombo();
      break;
    }
    case 'purchaseReportPreset': {
      var range = presetRange(t.dataset.preset);
      if(range){
        state.purchaseReportStart = toDateInputValue(range[0]);
        state.purchaseReportEnd = toDateInputValue(range[1]);
        state.purchaseReportPreset = t.dataset.preset;
      }
      render();
      break;
    }
    case 'viewPurchaseDrilldown':
      state.purchaseDrilldown = {category: t.dataset.category};
      state.purchaseDrilldownSearch = '';
      state.purchaseDrilldownSort = {key:'date', dir:'desc'};
      render();
      break;
    case 'closePurchaseDrilldown':
      state.purchaseDrilldown = null;
      render();
      break;
    case 'printPage':
      window.print();
      break;
    default: break;
  }
});

document.addEventListener('submit', function(e){
  var form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  var kind = form.dataset.form;
  if(kind === 'ingredient') saveIngredient(form);
  else if(kind === 'recipe') saveRecipe(form, state.tempLines);
  else if(kind === 'count'){
    var fd = new FormData(form);
    var linesArr = state.ingredients.map(function(ing){
      var qty = parseFloat(fd.get('qty_'+ing.id))||0;
      var uc = unitCostOf(ing);
      return {ingredientId:ing.id, name:ing.name, unit:ing.invUnit, countedQty:qty, unitCost:round2(uc), extValue:round2(qty*uc)};
    });
    saveCount(fd.get('label'), fd.get('date'), linesArr);
  }
  else if(kind === 'po'){
    var fd2 = new FormData(form);
    var vendor = fd2.get('vendor');
    var items = state.ingredients.filter(function(i){ return i.vendor===vendor; });
    var linesArr2 = items.map(function(ing){
      var qty = parseFloat(fd2.get('qty_'+ing.id))||0;
      var cost = parseFloat(fd2.get('cost_'+ing.id))||0;
      return {ingredientId:ing.id, qty:qty, unitCost:cost};
    }).filter(function(l){ return l.qty>0; });
    if(!linesArr2.length){ toast('Add a quantity for at least 1 item.'); return; }
    savePO(vendor, fd2.get('date'), linesArr2);
  }
  else if(kind === 'sales'){
    var fd3 = new FormData(form);
    var linesArr3 = state.recipes.map(function(r){ return {recipeId:r.id, qty: parseFloat(fd3.get('qty_'+r.id))||0}; });
    saveSales(fd3.get('dateFrom'), fd3.get('dateTo'), '', linesArr3);
  }
  else if(kind === 'invoice'){
    var fd4 = new FormData(form);
    var vendor4 = (fd4.get('vendor')||'').trim();
    var candidateLines4 = state.tempLines.filter(function(l){ return num(l.qty)>0 && (l.ingredientId || (l.description||'').trim()); });
    if(!vendor4){ toast('Enter a vendor name.'); return; }
    if(!candidateLines4.length){ toast('Match or add at least 1 line item with a quantity.'); return; }
    var newlyCreatedIds4 = {};
    var linesArr4 = candidateLines4.map(function(l){
      if(l.ingredientId){
        var ing4 = byId(state.ingredients, l.ingredientId);
        if(ing4 && l.category && ing4.category !== l.category){
          updateCollection('ingredients', ing4.id, {category: l.category, department: defaultDept(l.category)});
        }
        return {ingredientId:l.ingredientId, qty:num(l.qty), unitCost:num(l.unitCost)};
      }
      var cat4 = l.category || 'Food';
      var newId4 = uid();
      var unitCost4 = round2(num(l.unitCost));
      var newIng4 = {
        id: newId4, name: (l.description||'New item').trim(), category: cat4, vendor: vendor4,
        invUnit: 'each', unitsPerPack: 1, costPerPack: unitCost4,
        parLevel: 0, onHand: round2(num(l.qty)),
        storageArea: (cat4==='Wine'||cat4==='Liquor'||cat4==='Beer'||cat4==='N/A Bev') ? 'Bar' : 'Dry Storage',
        department: defaultDept(cat4),
        priceHistory: [{date: isoNow(), costPerPack: unitCost4, costPerUnit: unitCost4}],
        createdAt: isoNow()
      };
      state.ingredients.push(newIng4);
      var bodyNoId4 = Object.assign({}, newIng4);
      delete bodyNoId4.id;
      persistCollection('ingredients', newId4, bodyNoId4);
      newlyCreatedIds4[newId4] = true;
      return {ingredientId:newId4, qty:num(l.qty), unitCost:num(l.unitCost)};
    });
    saveInvoicePO(vendor4, fd4.get('date'), linesArr4, state.invoiceAssetId, newlyCreatedIds4);
  }
});
